<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions</title>
<link rel="stylesheet" href="/kit.css">
<style>
.sekmeler{display:flex;gap:4px;width:fit-content;padding:4px;margin-bottom:16px;border:1px solid var(--cizgi);border-radius:10px;background:var(--yuzey)}
.sekmeler button{padding:6px 14px;border:0;border-radius:7px;background:none;color:var(--soluk);font-size:13px;font-weight:600;cursor:pointer}
.sekmeler button.secili{background:var(--yuzey2);color:var(--metin)}
main.tam{max-width:none;margin:0;padding:0;position:relative}
main.tam .sekmeler{position:absolute;left:16px;top:12px;z-index:1;margin:0}
.ses-kart{margin-bottom:16px}
.ses-aciklama{margin:0 0 8px;font-size:13px}
.ses-satir{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--cizgi);font-size:14px}
.ses-satir span{flex:1;min-width:200px;font-weight:600}
.ses-satir button{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--cizgi);border-radius:8px;background:var(--yuzey);color:var(--metin)}
.ses-satir button:disabled{opacity:.4}
.ses-satir button.ses-sec{justify-content:space-between;gap:10px;width:auto;min-width:220px;padding:0 10px;background:var(--yuzey2);font-size:13px;cursor:pointer}
.ses-liste h3{margin:12px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--soluk)}
.ses-secenek{display:flex;align-items:center;gap:4px;border-radius:8px}
.ses-secenek:hover{background:var(--yuzey2)}
.ses-secenek.secili{background:var(--yuzey2)}
.ses-ad{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:36px;padding:0 8px;border:0;background:none;color:inherit;font-size:14px;text-align:left;cursor:pointer}
.ses-tik{flex:none;width:14px;display:flex;color:var(--vurgu)}
.ses-cal{flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin-right:2px;border:0;border-radius:8px;background:none;color:var(--metin);cursor:pointer}
.ses-cal:hover{background:var(--yuzey)}
.ses-not{margin:8px 0 0;font-size:12px}
.ses-kanca-satir{margin-top:8px}
.ses-kanca-satir small{display:block;font-size:12px;font-weight:400;color:var(--soluk)}
.ses-satir button.ses-anahtar{position:relative;width:34px;height:20px;border:0;border-radius:99px;background:var(--cizgi);padding:0}
.ses-anahtar::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.ses-satir button.ses-anahtar.on{background:var(--yesil)}
.ses-anahtar.on::after{left:16px}
.ses-hata{color:var(--kirmizi)}

.ofis{min-height:100vh;display:flex;flex-direction:column;--duvar:#2b2740;--zemin1:#cdbb9a;--zemin2:#c3b08f;color:#ece9f5}
.ust{position:relative;height:144px;flex:none;background:var(--duvar);border-bottom:6px solid #191626;display:flex;align-items:flex-end;justify-content:center;gap:clamp(16px,5vw,64px);padding-bottom:12px;overflow:hidden}
.pencere{flex:none;width:92px;height:62px;border:4px solid #191626;background:linear-gradient(90deg,transparent 48%,#191626 48% 52%,transparent 52%),var(--gok);box-shadow:inset 0 -14px 0 rgba(0,0,0,.18)}
/* the counts sit beside the tabs, above the wall: with the panel open the wall is narrow and would cover them */
.ozet{position:absolute;left:var(--sekmeler-bitis,16px);right:124px;top:20px;z-index:1;display:flex;flex-wrap:nowrap;overflow:hidden;gap:6px;font-size:12px;font-weight:600;pointer-events:none}
.ozet span{padding:3px 9px;border-radius:99px;background:rgba(13,11,20,.72);white-space:nowrap}
.ozet .onay{background:#c9352a;color:#fff}
.esya-dugme{position:absolute;right:16px;top:12px;padding:6px 12px;border:1px solid #4a4560;border-radius:8px;background:rgba(13,11,20,.6);color:#ece9f5;font-size:12px;font-weight:600;cursor:pointer}
.esya-dugme:hover{background:rgba(13,11,20,.85)}
.saat{flex:none;position:relative;width:52px;height:52px;margin-bottom:6px;border:4px solid #191626;border-radius:50%;background:#f3efe6}
.saat i{position:absolute;left:50%;bottom:50%;width:3px;margin-left:-1.5px;background:#191626;transform-origin:50% 100%}
.saat .akrep{height:13px}.saat .yelkovan{height:19px;width:2px;margin-left:-1px}
.piksel{display:block;flex:none;shape-rendering:crispEdges}
.zemin{position:relative;flex:1;display:flex;flex-direction:column;gap:24px;padding:0 clamp(12px,3vw,32px) 96px;background:repeating-conic-gradient(var(--zemin1) 0 25%,var(--zemin2) 0 50%) 0 0/48px 48px}
.arka{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;min-height:20px;pointer-events:none}
.kume{display:flex;align-items:flex-end;gap:20px}
.tezgah{display:flex;justify-content:center;width:112px;padding-bottom:30px;background:linear-gradient(#7b5a3f,#7b5a3f) bottom/100% 30px no-repeat;border-bottom:6px solid #573e2b}
.masalar{display:grid;grid-template-columns:repeat(auto-fill,200px);justify-content:center;gap:30px 18px}
#kedi-katman{position:absolute;left:0;right:0;top:144px;bottom:0;overflow:hidden;pointer-events:none}
.kedi{position:absolute;left:0;top:0;width:84px;height:54px;pointer-events:auto;cursor:pointer}
.kedi-ic{display:block}
.kedi.sag .kedi-ic{transform:scaleX(-1)}
.kedi g{display:none}
.kedi[data-poz=sit] .sit-a{display:block;animation:kare-a 2.4s steps(1) infinite}
.kedi[data-poz=sit] .sit-b{display:block;animation:kare-b 2.4s steps(1) infinite}
.kedi[data-poz=walk] .walk-a{display:block;animation:kare-a .36s steps(1) infinite}
.kedi[data-poz=walk] .walk-b{display:block;animation:kare-b .36s steps(1) infinite}
.kedi[data-poz=run] .walk-a{display:block;animation:kare-a .18s steps(1) infinite}
.kedi[data-poz=run] .walk-b{display:block;animation:kare-b .18s steps(1) infinite}
.kedi[data-poz=sleep] .sleep{display:block}
.kedi[data-poz=sleep] svg{transform-origin:50% 100%;animation:kedi-nefes 3s ease-in-out infinite}
@keyframes kedi-nefes{50%{transform:scaleY(1.05)}}
.kedi.sevincli svg{animation:kedi-zipla .32s ease-out 2}
@keyframes kedi-zipla{50%{transform:translateY(-12px)}}
.kedi-balon{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);padding:2px 8px;border-radius:99px;background:#fff;color:#2b2740;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;animation:kedi-balon 1.3s ease-out forwards}
.kedi-balon.kalp{background:none;color:#e0567f;font-size:18px}
@keyframes kedi-balon{70%{opacity:1}100%{opacity:0;margin-bottom:18px}}
.masa{position:relative;height:196px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:center;cursor:pointer;border-radius:12px}
.masa:hover,.masa:focus-visible{background:rgba(43,39,64,.14);outline:0}
.sandalye{position:absolute;left:50%;top:44px;width:76px;height:84px;margin-left:-38px;border-radius:12px 12px 0 0;background:#4a4560;box-shadow:inset 0 6px 0 #5b5575}
.kisi{position:absolute;left:50%;top:36px;margin-left:-42px;width:84px;height:84px;shape-rendering:crispEdges;overflow:visible}
.kare{display:none}.kare.a{display:block}
.calisiyor .kare.a{animation:kare-a .5s steps(1) infinite}
.calisiyor .kare.b{display:block;animation:kare-b .5s steps(1) infinite}
@keyframes kare-a{0%{opacity:1}50%{opacity:0}}
@keyframes kare-b{0%{opacity:0}50%{opacity:1}}
.onay .kisi{animation:zipla .55s steps(2) infinite}
@keyframes zipla{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
.tahta{position:absolute;left:12px;right:12px;top:112px;height:18px;background:#7b5a3f;border-bottom:6px solid #573e2b;border-radius:2px}
.ekran{position:absolute;right:18px;top:78px;width:44px;height:32px;background:#191626;border:3px solid #0f0d17;border-radius:2px}
.ekran::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:6px;margin-left:-6px;background:#0f0d17}
.ekran i{display:block;height:100%;background:#2b2740}
.calisiyor .ekran i{background:repeating-linear-gradient(0deg,#5fd38d 0 2px,#173325 2px 5px);animation:yanip 1s steps(3) infinite}
@keyframes yanip{0%{opacity:.55}50%{opacity:1}100%{opacity:.75}}
.onay .ekran i{background:#c9352a;animation:yanip .55s steps(2) infinite}
.bitti .ekran i{background:#2f8f5b}
.bardak{position:absolute;left:26px;top:101px;width:12px;height:11px;background:#d9d4e8;border-radius:0 0 2px 2px;box-shadow:inset 0 3px 0 #6d4c33}
.balon{position:absolute;left:50%;top:0;transform:translateX(-50%);min-width:28px;height:26px;line-height:22px;padding:0 8px;border:2px solid #0f0d17;border-radius:8px;background:#fff;color:#0f0d17;font-weight:800;font-size:14px;z-index:1}
.balon::after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:8px;margin-left:-4px;background:inherit;border-right:2px solid #0f0d17;border-bottom:2px solid #0f0d17;transform:rotate(45deg)}
.onay .balon{background:#c9352a;color:#fff;animation:balon-zipla .55s steps(2) infinite}
@keyframes balon-zipla{0%{transform:translateX(-50%)}100%{transform:translateX(-50%) translateY(-6px)}}
.bitti .balon{background:#2f8f5b;color:#fff}
.yanitsiz .balon{background:#d9d4e8}
.levha{position:absolute;left:12px;right:12px;top:144px;padding:5px 8px;border-radius:8px;background:rgba(32,28,48,.92);font-size:13px;line-height:1.3}
.levha b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.levha small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;color:#c4bfd6}
.bos-ofis{grid-column:1/-1;padding:64px 16px;text-align:center;font-size:14px;color:#2b2740}
.esya-liste{padding:0 8px 4px}
.esya-liste .ses-satir:first-child{border-top:0}
@media (prefers-color-scheme:dark){
  .ofis{--duvar:#211e30;--zemin1:#3b3647;--zemin2:#363142}
  .sandalye{background:#5b5575;box-shadow:inset 0 6px 0 #6d6689}
  .masa:hover,.masa:focus-visible{background:rgba(255,255,255,.06)}
  .bos-ofis{color:#d9d4e8}
}
/* what a running session is doing, over its desk */
.balon.is{max-width:188px;height:24px;line-height:20px;font-size:12px;font-weight:700;padding:0 8px;text-align:left}
.balon.is span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.balon.dusunuyor{background:#ece9f5;color:#4a4560}
.balon.yeni{animation:balon-gel .28s ease-out}
.onay .balon.is.yeni{animation:balon-gel .28s ease-out,balon-zipla .55s steps(2) .28s infinite}
@keyframes balon-gel{from{transform:translateX(-50%) translateY(6px) scale(.7);opacity:0}}
.masa.secili{background:rgba(43,39,64,.18);box-shadow:0 0 0 2px var(--vurgu)}
@media (prefers-color-scheme:dark){.masa.secili{background:rgba(255,255,255,.08)}}

/* the right-hand panel: what one session did; wider than the kit's, it holds paths and commands */
@media (min-width:768px){:root{--pg:clamp(440px,46vw,720px)}}
@media (min-width:768px){
  main.tam.panel-acik{padding-right:var(--pg)}
  main:not(.tam).panel-acik{padding-right:max(16px,calc(var(--pg) + 16px - (100vw - min(1180px,100vw)) / 2))}
}
.oturum-panel{--ust:0px}
.oturum-panel .icerik{padding:16px 20px 32px}
.p-baslik{margin:0 0 4px;font-size:17px;font-weight:700;line-height:1.3;text-transform:none;letter-spacing:0;color:var(--metin);overflow-wrap:anywhere}
.p-durum{margin:0 0 12px;font-size:13px;color:var(--soluk)}
.p-durum b{font-weight:600;color:var(--metin)}
.p-durum b.onay{color:var(--kirmizi)}
.p-simdi{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--yuzey2);font-size:13px;font-weight:600;overflow:hidden}
.p-simdi span:last-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p-simdi.onay{background:color-mix(in srgb,var(--kirmizi) 14%,transparent)}
.canli-nokta{flex:none;width:8px;height:8px;border-radius:50%;background:var(--yesil);animation:canli 1.2s ease-in-out infinite}
.p-simdi.onay .canli-nokta{background:var(--kirmizi)}
@keyframes canli{50%{opacity:.25}}
.arti{color:var(--yesil)}.eksi{color:var(--kirmizi)}
/* the log: messages as chat bubbles, each tool call as a line with its icon and colour */
.kayit{padding-bottom:8px}
.k-ara{display:flex;justify-content:center;margin:16px 0 8px}
.k-ara span{padding:2px 10px;border-radius:6px;background:var(--yuzey2);color:var(--soluk);font-size:11.5px;font-weight:600}
.k-mesaj{display:flex;margin:8px 0}
.k-mesaj.sen{justify-content:flex-end}
.k-balon{max-width:88%;padding:8px 12px;border-radius:12px;background:var(--yuzey2);font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.sen .k-balon{background:color-mix(in srgb,var(--vurgu) 15%,var(--yuzey));border-bottom-right-radius:4px}
.claude .k-balon{border-bottom-left-radius:4px}
.k-kim{display:block;margin-bottom:2px;font-size:11px;font-weight:600;color:var(--soluk)}
.k-balon.kisa .k-yazi{max-height:10.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.k-devam,.k-eski{padding:4px 0 0;border:0;background:none;color:var(--mavi);font-size:12px;font-weight:600}
.k-eski{display:block;margin:4px auto 8px}
.k-is{display:flex;align-items:center;gap:10px;width:100%;margin:1px 0;padding:4px 8px;border:0;border-radius:8px;background:none;color:var(--metin);font-size:13px;text-align:left}
.k-is:hover{background:var(--yuzey2)}
.k-ikon{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:var(--k);background:color-mix(in srgb,var(--k) 15%,transparent)}
.k-read{--k:var(--mavi)}.k-edit{--k:var(--turuncu)}.k-write{--k:var(--yesil)}.k-bash{--k:var(--mor)}.k-grep{--k:var(--gri)}
.k-web{--k:#0e9fb3}.k-agent{--k:#c28a0a}.k-mcp{--k:#d6457f}.k-ask,.k-todo,.k-tool{--k:var(--gri)}
.k-is.hata{--k:var(--kirmizi)}
.k-is.hata .k-metin{text-decoration:line-through;text-decoration-color:var(--kirmizi)}
.k-metin{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.k-sag{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums}
.k-saat{font-size:11px;color:var(--soluk)}
.oturum-panel .p-simdi{position:sticky;bottom:12px;margin:8px 0 0;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* colours in code */
:root{--r-yorum:#8b8b94;--r-metin:#1f7a4d;--r-anahtar:#7c3aed;--r-sayi:#b45309;--r-degisken:#0e7490;--r-komut:#2563eb;--r-islev:#9a3412}
@media (prefers-color-scheme:dark){:root{--r-yorum:#7d7d88;--r-metin:#86d9a8;--r-anahtar:#c4a5ff;--r-sayi:#f5b971;--r-degisken:#6fd6e8;--r-komut:#82b4ff;--r-islev:#f0a580}}
.r-yorum{color:var(--r-yorum);font-style:italic}.r-metin{color:var(--r-metin)}.r-anahtar{color:var(--r-anahtar)}.r-sayi,.r-secenek{color:var(--r-sayi)}
.r-degisken{color:var(--r-degisken)}.r-komut{color:var(--r-komut);font-weight:600}.r-islev{color:var(--r-islev)}
.fark i{display:inline-block;width:1.2em;font-style:normal;color:var(--soluk)}
.adim details>summary{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--cizgi);border-radius:8px;list-style:none;font-size:12.5px;font-weight:600;color:var(--metin);cursor:pointer}
.adim details>summary::-webkit-details-marker{display:none}
.adim details[open]>summary{margin-bottom:6px}
.adim details.ham{margin-top:20px;padding-top:12px;border-top:1px solid var(--cizgi)}
.etiket{flex:none;padding:0 5px;border-radius:4px;background:var(--yuzey2);color:var(--soluk);font-size:11px;font-weight:600;white-space:nowrap}
.etiket.uyari{background:color-mix(in srgb,var(--turuncu) 16%,transparent);color:var(--turuncu)}
.popup.genis.adim-pencere{height:fit-content}
.adim{padding:4px 8px 8px;font-size:14px}
.adim-ust{margin:0 0 4px;font-size:13px;color:var(--soluk)}
.adim-ust b{display:inline}.adim-ust .adim-ok{color:var(--yesil)}.adim-ust .adim-error{color:var(--kirmizi)}.adim-ust .adim-running{color:var(--turuncu)}
.adim h3{margin:16px 0 6px;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--metin)}
.adim p{margin:6px 0;overflow-wrap:anywhere}
.adim-pre{margin:0;padding:10px 12px;border-radius:8px;background:var(--yuzey2);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto}
.adim-pre.hata{color:var(--kirmizi)}
.adim-aciklama{margin:4px 0 0;font-size:16px;font-weight:600;line-height:1.4}
.parcalar{margin:0;padding:0;list-style:none;counter-reset:parca}
.parcalar li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--cizgi)}
.parcalar li:last-child{border-bottom:0}
.parcalar li::before{counter-increment:parca;content:counter(parca);grid-row:span 3;align-self:start;width:22px;height:22px;border-radius:50%;background:var(--yuzey2);color:var(--soluk);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.parcalar b{font-weight:600}
.parcalar b.bilinmiyor{font-weight:400;color:var(--soluk)}
.parcalar code{display:block;padding:0;background:none;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soluk);white-space:pre-wrap;overflow-wrap:anywhere}
.parcalar .baglac{font-size:12px;font-weight:600;color:var(--soluk)}
.adim details{margin-top:12px}
.adim summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--soluk)}
.adim details .adim-pre{margin-top:6px}
.adim-gorsel{display:block;margin:0 0 8px}
.adim-gorsel img{display:block;max-width:100%;max-height:70vh;border:1px solid var(--cizgi);border-radius:8px;background:var(--yuzey2)}
.adim-uyari{margin:8px 0 0;font-size:12px;color:var(--soluk)}
.fark>span{display:block;padding:0 4px;border-radius:2px}
.fark-ekle{background:color-mix(in srgb,var(--yesil) 16%,transparent)}
.fark-sil{background:color-mix(in srgb,var(--kirmizi) 14%,transparent)}
.fark-bas{color:var(--soluk)}
.p-not{margin:24px 0 0;font-size:12px;color:var(--soluk)}

/* every session, the older ones too */
.gecmis{max-width:760px}
.g-ust{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.g-ust input,.g-ust select{height:36px;padding:0 10px;border:1px solid var(--cizgi);border-radius:8px;background:var(--yuzey);color:var(--metin);font:inherit}
.g-ust input{flex:1;min-width:180px}
.g-ust select{max-width:220px}
.g-gun{margin:18px 0 4px;font-size:13px;font-weight:700;color:var(--soluk)}
.g-satir{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:inherit;text-align:left}
.g-satir:hover{background:var(--yuzey2)}
.g-satir.secili{background:var(--yuzey2);box-shadow:inset 3px 0 0 var(--vurgu)}
.g-satir span:first-child{flex:1;min-width:0}
.g-satir b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g-satir small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g-durum{flex:none;font-size:12px;font-weight:600;color:var(--yesil)}
.g-durum.onay{color:var(--kirmizi)}
.g-not{margin:20px 10px 0;font-size:12px}

.durgun *,.durgun *::after{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.kisi,.kare,.ekran i,.balon,.kedi g,.kedi svg,.canli-nokta{animation:none!important}.calisiyor .kare.b{display:none}.calisiyor .kare.a{opacity:1}.kedi[data-poz=sit] .sit-b{display:none}}
</style>
</head>
<body>

<main id="sayfa"><nav class="sekmeler" id="sekmeler" aria-label="Claude Sessions"></nav><div id="sounds" hidden></div><div id="icerik"></div><div id="kedi-katman" hidden></div></main>
<div id="panel"></div>
<script src="/kit.js"></script>
<script>
"use strict";
const STATUS = { onay: t("Waiting for approval"), calisiyor: t("Running"), bitti: t("Done · your turn"), yanitsiz: t("No response") };
let sessions = [], failed = false;
const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch { /* a private window */ } };
const TABS = [["office", () => t("Office")], ["history", () => t("All sessions")], ["sound", () => t("Sound")]];
let tab = TABS.some(([id]) => id === stored("claude.tab")) ? stored("claude.tab") : "office";

// —— Office: the sessions, sitting at their desks. Everything in it is drawn from text, nothing is an image file.
const BUBBLE = { onay: "!", bitti: "✓", yanitsiz: "z z" };
const HOME_AFTER_S = 3 * 3600; // a session finished this long ago has gone home: its desk is free
// Each letter is a colour of the pixel below. H hair, S skin, E eye, M mouth, T shirt, D shirt shadow.
const HEAD = ["....HHHHHH....", "...HHHHHHHH...", "...HSSSSSSH...", "...SSESSESS...", "...SSSSSSSS...", "....SSMMSS....", ".....SSSS....."];
const BODY = ["...TTTTTTTT...", "..TTTTTTTTTT..", "..TDTTTTTTDT..", "..TDTTTTTTDT.."];
const POSES = {
  typingA: [...HEAD, ...BODY, "..SSTTTTTTSS..", ".........SS..."],
  typingB: [...HEAD, ...BODY, "..SSTTTTTTSS..", "...SS........."],
  raised: ["....HHHHHH..SS", "...HHHHHHHH.SS", "...HSSSSSSH.SS", "...SSESSESS.TT", "...SSSSSSSS.TT", "....SSMMSS..TT", ".....SSSS...TT", "...TTTTTTTTTTT", "..TTTTTTTTTT..", "..TDTTTTTTDT..", "..TDTTTTTTDT..", "..SSTTTTTT....", ".............."],
  resting: ["....HHHHHH....", "...HHHHHHHH...", "...HSSSSSSH...", "...SEESSEES...", "...SSSSSSSS...", "....SMMMMS....", ".....SSSS.....", ...BODY, "..SSTTTTTTSS..", ".............."],
  asleep: ["..............", "....HHHHHH....", "...HHHHHHHH...", "...HSSSSSSH...", "...SEESSEES...", "...SSSSSSSS...", "....SSSSSS....", "...TTTTTTTT...", "..TTTTTTTTTT..", "..TDTTTTTTDT..", "..TDTTTTTTDT..", "..SSTTTTTTSS..", ".............."],
};
const HAIR = ["#2a1d17", "#5a3620", "#b0772c", "#8c2f22", "#1f2b4d", "#d8d3e0", "#3d2a5c"];
const SKIN = ["#f2c9a5", "#e0ac83", "#c68c5f", "#8d5a3b"];
const SHIRT = ["#4f86d9", "#d9694f", "#49a878", "#a66bd4", "#d9a93f", "#3fb1b8", "#d65f91", "#7a8598"];
const hash = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const darker = (hex) => `#${[1, 3, 5].map((i) => Math.round(parseInt(hex.slice(i, i + 2), 16) * 0.75).toString(16).padStart(2, "0")).join("")}`;
const pixels = (rows, colors) => rows.flatMap((row, y) => [...row].map((c, x) => (colors[c] ? `<rect x="${x}" y="${y}" width="1" height="1" fill="${colors[c]}"/>` : ""))).join("");

function person(session) {
  const seed = hash(session.proje), shirt = SHIRT[seed % SHIRT.length];
  const colors = { H: HAIR[(seed >>> 3) % HAIR.length], S: SKIN[(seed >>> 6) % SKIN.length], E: "#17121f", M: "#7a3f34", T: shirt, D: darker(shirt) };
  const frame = (pose, which) => `<g class="kare ${which}">${pixels(pose, colors)}</g>`;
  const frames = session.durum === "calisiyor" ? frame(POSES.typingA, "a") + frame(POSES.typingB, "b")
    : frame(session.durum === "onay" ? POSES.raised : session.durum === "bitti" ? POSES.resting : POSES.asleep, "a");
  return `<svg class="kisi" viewBox="0 0 14 14" aria-hidden="true">${frames}</svg>`;
}

// Furniture: some hangs between the windows, the rest stands along the back wall.
const SPRITES = {
  painting: { size: 5, colors: { F: "#8a6545", S: "#8cc8ee", M: "#3f9b5b", Y: "#f2d16b" }, rows: ["FFFFFFFFFFFFFF", "FSSSSSSSSYYSSF", "FSSSSSSSSYYSSF", "FSSSSMSSSSSSSF", "FSSSMMMSSSSSSF", "FSSMMMMMSSMSSF", "FMMMMMMMMMMMMF", "FFFFFFFFFFFFFF"] },
  whiteboard: { size: 5, colors: { F: "#9aa0ad", W: "#f3f4f7", R: "#c9352a", B: "#4f86d9", G: "#49a878" }, rows: ["FFFFFFFFFFFFFFFF", "FWWWWWWWWWWWWWWF", "FWRRRWWBBWWGGGWF", "FWWWWWWWWWWWWWWF", "FWWBBBBBWWRRWWWF", "FWWWWWWWWWWWWWWF", "FWGGWWWWBBBBBWWF", "FWWWWWWWWWWWWWWF", "FFFFFFFFFFFFFFFF"] },
  plant: { size: 6, colors: { G: "#3f9b5b", g: "#2c7544", P: "#b5623c", p: "#8f4a2c" }, rows: [".....GG.......", "...G.GGG.G....", "..GGGgGGGGG...", "...GGGgGGG....", "..GGgGGgGGG...", "....GGgGG.....", ".....gg.......", ".....gg.......", "...PPPPPP.....", "...PPPPPP.....", "....pppp......", "....pppp......"] },
  coffee: { size: 6, colors: { K: "#57536a", S: "#9a98a6", R: "#c9352a", C: "#f3efe6", B: "#6d4c33" }, rows: ["KKKKKKKK", "KSSSSSSK", "KSRSSSSK", "KKKKKKKK", "KK....KK", "KK.CC.KK", "KK.CB.KK", "KKKKKKKK", "SSSSSSSS"] },
  cooler: { size: 6, colors: { W: "#dfe7ef", B: "#6fb7e6", b: "#3f8fc9", K: "#55606b" }, rows: [".BBBB.", "BBBBBB", "BbBBBB", "BBBBBB", ".BBBB.", "WWWWWW", "WKWWKW", "WWWWWW", "WWWWWW", "WWWWWW", "WWWWWW", "KKKKKK"] },
  shelf: { size: 7, colors: { W: "#6d4c33", R: "#c9352a", B: "#4f86d9", G: "#49a878", Y: "#d9a93f", P: "#a66bd4" }, rows: ["WWWWWWWWWWWWWW", "W.RRBBGGYY.PPW", "W.RRBBGGYY.PPW", "W.RRBBGGYY.PPW", "WWWWWWWWWWWWWW", "W.YYPP.RRGGBBW", "W.YYPP.RRGGBBW", "W.YYPP.RRGGBBW", "WWWWWWWWWWWWWW", "W.GGRR.BB.YYPW", "W.GGRR.BB.YYPW", "WWWWWWWWWWWWWW"] },
  lamp: { size: 6, colors: { Y: "#f2d16b", y: "#d9a93f", K: "#75707f" }, rows: ["...YYYY...", "..YYYYYY..", ".YYYYYYYY.", "yYYYYYYYYy", "....KK....", "....KK....", "....KK....", "....KK....", "....KK....", "....KK....", "....KK....", "..KKKKKK.."] },
};
const sprite = (id) => {
  const { rows, colors, size } = SPRITES[id], w = rows[0].length, h = rows.length;
  return `<svg class="piksel" width="${w * size}" height="${h * size}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${pixels(rows, colors)}</svg>`;
};
const FURNITURE = [
  ["clock", () => t("Clock")], ["painting", () => t("Painting")], ["whiteboard", () => t("Whiteboard")],
  ["plant", () => t("Plant")], ["coffee", () => t("Coffee machine")], ["cooler", () => t("Water cooler")],
  ["shelf", () => t("Bookshelf")], ["lamp", () => t("Floor lamp")], ["cat", () => t("Cat")],
];
let furniture = [];
const clockHtml = () => {
  const now = new Date(), minutes = now.getMinutes(), hours = (now.getHours() % 12) + minutes / 60;
  return `<div class="saat" title="${esc(now.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" }))}"><i class="akrep" style="transform:rotate(${hours * 30}deg)"></i><i class="yelkovan" style="transform:rotate(${minutes * 6}deg)"></i></div>`;
};
const has = (id) => furniture.includes(id);

// The same session keeps its desk while the list changes around it.
let desks = {};
try { desks = JSON.parse(stored("claude.desks")) || {}; } catch { /* nothing kept */ }
function assignDesks(present) {
  const ids = new Set(present.map((s) => s.oturum));
  for (const id of Object.keys(desks)) if (!ids.has(id)) delete desks[id];
  const taken = new Set(Object.values(desks));
  for (const { oturum } of present) {
    if (desks[oturum] != null) continue;
    let free = 0;
    while (taken.has(free)) free++;
    desks[oturum] = free;
    taken.add(free);
  }
  store("claude.desks", JSON.stringify(desks));
}
const skyNow = () => {
  const h = new Date().getHours();
  return h >= 7 && h < 18 ? "linear-gradient(#8cc8ee,#cfe9f7)" : h >= 18 && h < 21 ? "linear-gradient(#5b4b8a,#e8976b)" : "linear-gradient(#10152e,#27305a)";
};
// What a session is busy with, in a few words: over its desk and at the top of its panel.
const NOW = {
  read: (name) => t("Reading {name}", { name }), edit: (name) => t("Editing {name}", { name }), write: (name) => t("Writing {name}", { name }),
  bash: (name, step) => step.aciklama || `$ ${name}`, grep: (name) => t("Searching for {name}", { name }), glob: (name) => t("Looking for {name}", { name }),
  fetch: (name) => t("Opening {name}", { name }), search: (name) => t("Searching the web: {name}", { name }), browser: (name) => t("In the browser: {name}", { name }),
  agent: (name) => t("Agent: {name}", { name }), ask: () => t("Asking you"), todo: () => t("Updating its to-do list"), mcp: (name) => name, tool: (name) => name,
};
const nowText = (step) => (step ? (NOW[step.tur] ?? NOW.tool)(step.ad, step) : t("Thinking…"));
const shownBubbles = {};
function bubbleHtml(s) {
  let text = BUBBLE[s.durum], kind = "";
  if (s.durum === "calisiyor") [text, kind] = [nowText(s.simdi), s.simdi ? " is" : " is dusunuyor"];
  else if (s.durum === "onay" && s.simdi) [text, kind] = [`! ${nowText(s.simdi)}`, " is"];
  if (!text) return "";
  // a new step pops in; the office is redrawn every few seconds and the same text stays still
  const fresh = shownBubbles[s.oturum] != null && shownBubbles[s.oturum] !== text;
  shownBubbles[s.oturum] = text;
  return `<span class="balon${kind}${fresh ? " yeni" : ""}">${kind ? `<span>${esc(text)}</span>` : esc(text)}</span>`;
}
function deskHtml(s) {
  return `<button type="button" class="masa ${esc(s.durum)}${panel?.id === s.oturum ? " secili" : ""}" data-oturum="${esc(s.oturum)}" title="${esc(STATUS[s.durum])}">
    ${bubbleHtml(s)}
    <span class="sandalye"></span>${person(s)}
    <span class="ekran"><i></i></span><span class="bardak"></span><span class="tahta"></span>
    <span class="levha"><b>${esc(String(s.proje).split(" / ").at(-1))}</b><small>${esc(s.baslik)}</small></span>
  </button>`;
}
function officeHtml() {
  // "sessiz": from before the hooks or idle for a long time, so nobody is at that desk.
  const now = Date.now() / 1000, seated = sessions.filter((s) => s.durum !== "sessiz");
  const shown = seated.filter((s) => s.durum === "onay" || s.durum === "calisiyor" || now - s.zaman < HOME_AFTER_S);
  assignDesks(shown);
  const inOrder = [...shown].sort((a, b) => desks[a.oturum] - desks[b.oturum]);
  const count = (d) => shown.filter((s) => s.durum === d).length;
  const pills = [
    count("onay") && `<span class="onay">${esc(t("{n} need you", { n: count("onay") }))}</span>`,
    count("calisiyor") && `<span>${esc(t("{n} working", { n: count("calisiyor") }))}</span>`,
    count("bitti") && `<span>${esc(t("{n} done", { n: count("bitti") }))}</span>`,
    seated.length > shown.length && `<span>${esc(t("{n} went home", { n: seated.length - shown.length }))}</span>`,
  ].filter(Boolean).join("");
  const wall = ['<div class="pencere"></div>', has("clock") ? clockHtml() : "", has("painting") ? sprite("painting") : "", '<div class="pencere"></div>', has("whiteboard") ? sprite("whiteboard") : ""].join("");
  // Furniture stands along the back wall, books on one side and the coffee corner on the other; the desks fill the room.
  const left = ["shelf", "lamp"].filter(has).map(sprite).join("");
  const right = [has("coffee") ? `<div class="tezgah">${sprite("coffee")}</div>` : "", ...["cooler", "plant"].filter(has).map(sprite)].join("");
  const empty = inOrder.length ? "" : `<p class="bos-ofis">${esc(failed ? t("Could not reach the server.") : t("The office is empty. Start a Claude session and someone sits down."))}</p>`;
  return `<div class="ofis"><div class="ust" style="--gok:${skyNow()}"><div class="ozet">${pills}</div><button type="button" class="esya-dugme" data-esyalar>${esc(t("Office furniture"))}</button>${wall}</div>
    <div class="zemin"><div class="arka"><div class="kume">${left}</div><div class="kume">${right}</div></div>
      <div class="masalar">${inOrder.map(deskHtml).join("")}${empty}</div></div></div>`;
}
let furnitureError = "";
const furnitureHtml = () => `<div class="esya-liste">${furnitureError ? `<p class="ses-not ses-hata">${esc(furnitureError)}</p>` : ""}${FURNITURE.map(([id, label]) => `<div class="ses-satir"><span>${esc(label())}</span><button type="button" class="ses-anahtar${has(id) ? " on" : ""}" role="switch" aria-checked="${has(id)}" aria-label="${esc(label())}" data-esya="${id}"></button></div>`).join("")}</div>`;
let furniturePopup = null;
async function toggleFurniture(id) {
  const before = furniture;
  furniture = has(id) ? furniture.filter((x) => x !== id) : [...furniture, id];
  furnitureError = "";
  furniturePopup?.setBody(furnitureHtml());
  draw();
  const r = await postSound("./api/office", { items: furniture }).catch(() => null);
  if (r?.ok) return;
  furniture = before;
  // shown in the window: a notice would stay behind it. A 404 is a server still running the code from before an update.
  const reason = r ? (await r.json().catch(() => ({}))).error || `HTTP ${r.status}` : t("Could not reach the server.");
  furnitureError = t("Could not save: {reason}", { reason: r?.status === 404 ? t("restart the dashboard, it is running an older version.") : reason });
  furniturePopup?.setBody(furnitureHtml());
  draw();
}
// —— Panel: what one session did, as one log in time order: what you wrote, what Claude wrote, and each tool call in
// between. Refreshed every few seconds while the session runs; a click on a call opens it in full.
let panel = null; // { id, data, error, limit, open: the long messages shown in full, timer, fromBottom }
const STEP_KIND = {
  read: () => t("Read"), edit: () => t("Edit"), write: () => t("Write"), bash: () => t("Command"), grep: () => t("Search"), glob: () => t("Search"),
  fetch: () => t("Web"), search: () => t("Web search"), browser: () => t("Browser"), agent: () => t("Agent"), ask: () => t("Question"), todo: () => t("To-dos"), mcp: () => "MCP", tool: () => t("Tool"),
};
// what reached beyond the project; a light tint on what changed something beyond this computer
const OUTSIDE = {
  deploy: [() => t("Pushed or deployed"), "uyari"], db: [() => t("Database"), "uyari"], outside: [() => t("Wrote outside the project"), ""],
  "mcp-write": [() => t("Changed through MCP"), "uyari"], publish: [() => t("Published"), "uyari"], git: [() => t("Git"), ""], network: [() => t("Network"), ""], mcp: [() => "MCP", ""],
};
const clock = (z) => new Date(z * 1000).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
const isLive = (s) => s?.durum === "calisiyor" || s?.durum === "onay";
const infoOf = (id) => sessions.find((s) => s.oturum === id) ?? everySession?.oturumlar.find((s) => s.oturum === id) ?? {};
const GAP_S = 20 * 60; // a pause this long gets the time written above what follows, as in a chat
const PAGE = 300;

// One icon and one colour for each kind of work, so the log reads at a glance.
const ICONS = {
  read: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  write: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/>',
  bash: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  grep: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  web: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>',
  agent: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  mcp: '<path d="M12 22v-5"/><path d="M9 8V2M15 8V2"/><path d="M18 8v5a6 6 0 0 1-12 0V8Z"/>',
  ask: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  todo: '<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9Z"/>',
};
const LOOK = { read: "read", edit: "edit", write: "write", bash: "bash", grep: "grep", glob: "grep", fetch: "web", search: "web", browser: "web", agent: "agent", mcp: "mcp", ask: "ask", todo: "todo" };
const icon = (look) => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[look] ?? ICONS.tool}</svg>`;

// What each call did, said as a sentence.
const DONE = {
  read: (e) => t("Read {name}", { name: e.ad }),
  edit: (e) => t("Edited {name}", { name: e.ad }),
  write: (e) => (e.yeni ? t("Created {name}", { name: e.ad }) : t("Wrote {name}", { name: e.ad })),
  bash: (e) => e.aciklama || `$ ${e.ad}`,
  grep: (e) => t("Searched the code for “{name}”", { name: e.ad }),
  glob: (e) => t("Looked for files named {name}", { name: e.ad }),
  fetch: (e) => t("Opened {name}", { name: e.url ? e.url.replace(/^https?:\/\/(www\.)?/, "") : e.ad }),
  search: (e) => t("Searched the web for “{name}”", { name: e.ad }),
  browser: (e) => t("In the browser: {name}", { name: e.ad }),
  agent: (e) => t("Gave an agent a task: {name}", { name: e.ad }),
  ask: (e) => t("Asked you: {name}", { name: e.ad }),
  todo: () => t("Updated its to-do list"),
};

function entryHtml(e) {
  const look = LOOK[e.tur] ?? "tool";
  const tags = [];
  if (e.dis && OUTSIDE[e.dis]) tags.push(`<span class="etiket ${OUTSIDE[e.dis][1]}">${esc(OUTSIDE[e.dis][0]())}</span>`);
  if (e.tur === "mcp" && e.yazma) tags.push(`<span class="etiket uyari">${esc(t("Changed through MCP"))}</span>`);
  if (e.disarida) tags.push(`<span class="etiket">${esc(t("outside the project"))}</span>`);
  if (e.ajan) tags.push(`<span class="etiket">${esc(t("agent"))}</span>`);
  if (e.eklenen != null) tags.push(`<span class="arti">+${formatNumber(e.eklenen)}</span><span class="eksi">−${formatNumber(e.silinen)}</span>`);
  if (e.hata === null && panel.data?.canli) tags.push('<span class="canli-nokta"></span>');
  const text = (DONE[e.tur] ?? ((x) => x.ad))(e);
  return `<button type="button" class="k-is k-${look}${e.hata ? " hata" : ""}" data-adim="${esc(e.id)}" title="${esc(e.yol ?? e.komut ?? e.ad)}">
    <span class="k-ikon">${icon(look)}</span><span class="k-metin">${esc(text)}</span><span class="k-sag">${tags.join("")}<span class="k-saat">${esc(clock(e.zaman))}</span></span></button>`;
}

/** A message with a little markdown: headings, **bold**, `code` and links; the rest as written. */
const messageBody = (text) => text.split("\n").map((l) => (/^#{1,6}\s/.test(l) ? `<b>${inlineMd(l.replace(/^#+\s*/, ""))}</b>` : inlineMd(l))).join("<br>");
function messageHtml(e) {
  const key = `${e.kim}${e.zaman}`, long = e.metin.length > 700 || e.metin.split("\n").length > 12, open = panel.open.has(key);
  return `<div class="k-mesaj ${esc(e.kim)}"><div class="k-balon${long && !open ? " kisa" : ""}">
    <span class="k-kim">${esc(e.kim === "sen" ? t("You") : "Claude")} · ${esc(clock(e.zaman))}</span><div class="k-yazi">${messageBody(e.metin)}</div>
    ${long ? `<button type="button" class="k-devam" data-mesaj="${esc(key)}">${esc(open ? t("Show less") : t("Read all"))}</button>` : ""}</div></div>`;
}

function logHtml(d) {
  let html = d.kayitToplam > d.kayit.length ? `<button type="button" class="k-eski" data-eski>${esc(t("Show earlier ({n} more)", { n: formatNumber(d.kayitToplam - d.kayit.length) }))}</button>` : "";
  let last = 0;
  for (const e of d.kayit) {
    const newDay = last && isoDay(new Date(e.zaman * 1000)) !== isoDay(new Date(last * 1000));
    if (e.zaman && (!last || newDay || e.zaman - last > GAP_S)) html += `<div class="k-ara"><span>${esc(`${dayLabel(e.zaman)} ${clock(e.zaman)}`)}</span></div>`;
    if (e.zaman) last = e.zaman;
    html += e.tur === "mesaj" ? messageHtml(e) : entryHtml(e);
  }
  return html || `<p class="soluk p-not">${esc(t("No messages or steps yet."))}</p>`;
}

function panelHtml() {
  const s = infoOf(panel.id), d = panel.data;

  for (const m of text.matchAll(pattern)) {
    if (!m[0]) continue;
    const [, comment, string, variable, option, number, word] = m;
    const kind = comment ? "r-yorum" : string ? "r-metin" : variable ? "r-degisken" : option ? "r-secenek" : number ? "r-sayi"
      : word && keywords.has(word) ? "r-anahtar" : word && lang === "sh" && startsCommand(text, m.index) ? "r-komut"

/** Long paths in a command, made short: the project folder, the home folder and Claude's scratch folder. */
function shortPaths(text, d) {
  let out = String(text ?? "").replace(/\/(private\/)?tmp\/claude-\d+\/[^/\s'"]+\/[^/\s'"]+\/scratchpad/g, `‹${t("temporary folder")}›`);
  if (d.kok) out = out.split(d.kok).join(`‹${d.kok.split("/").pop()}›`);

/** Where a curl call goes: this computer's own server or a site on the internet, and whether it sends data. */

  if (!c) return t("Fetches a web address");
  if (c.local) return c.sends ? t("Sends data to the server on this computer (port {port}){path}", { port: c.port || 80, path: c.path && ` → ${c.path}` })

/**
 * A simple search pattern in words: `^ℹ (tests|pass|fail)|✖ ` is lines that start with “ℹ tests”, “ℹ pass” or
 * “ℹ fail”, or contain “✖”. A pattern with anything more than that returns nothing and is shown as it is.
 */
function patternSays(pattern) {
  const starts = [], contains = [];
  for (const alt of pattern.split("|").reduce((out, piece) => {
    // a `|` inside parentheses belongs to the group, not to the top level
    const open = (out.at(-1)?.match(/\(/g) ?? []).length - (out.at(-1)?.match(/\)/g) ?? []).length;
    if (out.length && open > 0) out[out.length - 1] += `|${piece}`;
    else out.push(piece);
    return out;
  }, [])) {
    const anchored = alt.startsWith("^"), body = alt.replace(/^\^/, "").replace(/\$$/, "");
    const group = body.match(/\(([^()]*)\)/);
    const texts = group ? group[1].split("|").map((g) => body.replace(group[0], g)) : [body];
    if (texts.some((x) => /[.*+?[\]{}()\\$^]/.test(x) || !x.trim())) return "";
    (anchored ? starts : contains).push(...texts.map((x) => `“${x.trim()}”`));
  }
  const list = (items) => items.join(", ");
  if (starts.length && contains.length) return t("Keeps only the lines that start with {starts} or contain {contains}", { starts: list(starts), contains: list(contains) });
  if (starts.length) return t("Keeps only the lines that start with {starts}", { starts: list(starts) });
  return contains.length ? t("Keeps only the lines that contain {contains}", { contains: list(contains) }) : "";
}

/** A loop that only waits (`until <check>; do :; done`, or with `sleep`) is one thing to a reader: waiting. */
function groupLoops(parts) {
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], loop = p.metin.match(/^(until|while)\s/);
    const end = loop ? parts.findIndex((x, j) => j > i && x.metin === "done") : -1;
    if (end === -1) {
      out.push(p);
      continue;
    }
    const body = parts.slice(i + 1, end).map((x) => x.metin.replace(/^do\s+/, "")).filter((x) => x && x !== "do");
    out.push({ ...p, dongu: loop[1], beklemek: body.every((x) => /^(:|true|sleep\b)/.test(x)), govde: body, metin: parts.slice(i, end + 1).map((x) => x.metin).join("; ") });
    i = end;
  }
  return out;
}

function partHtml(p, d, vars) {
  const show = (x) => shortPaths(expandVars(x, vars), d);
  let say;
  if (p.atama) {
    vars[p.atama.ad] = p.atama.deger;
    say = t("Notes {value} as ${name}, to use below", { value: show(p.atama.deger) || "\"\"", name: p.atama.ad });
  } else {
    const args = p.argumanlar.map(show);
    const port = p.program === "kill" && p.metin.match(/\$\(lsof\b[^)]*?:(\d+)/)?.[1];
    const pattern = args.find((a) => !a.startsWith("-"));
    if (port) say = t("Stops the program using port {port}", { port });
    else if (p.program === "grep" && p.sonra === "|" && pattern) say = patternSays(pattern) || t("Keeps only the lines that match {pattern}", { pattern: `“${pattern}”` });
    else {
      say = p.program === "curl" ? curlSays(args) : PROGRAMS[p.program]?.(args) ?? "";
      const inner = [...p.metin.matchAll(/\$\((\w+)/g)].map((m) => m[1]).filter((x) => PROGRAMS[x]);
      if (say && inner.length) say += ` (${inner.map((x) => PROGRAMS[x]([])).join(", ").toLocaleLowerCase(LOCALE)})`;
    }
    const local = p.program === "curl" && curlInfo(args);
    if (p.dongu && p.beklemek && p.dongu === "until" && local?.local) say = t("Waits until the server on this computer (port {port}) answers", { port: local.port || 80 });
    else if (p.dongu) {
      const check = say ? say.charAt(0).toLocaleLowerCase(LOCALE) + say.slice(1) : t("the check");
      say = p.beklemek
        ? (p.dongu === "until" ? t("Waits until this works: {check}", { check }) : t("Waits while this works: {check}", { check }))
        : t("Repeats {body} until this works: {check}", { body: p.govde.join("; "), check });
    }
    if (p.yazar && p.yazar !== "/dev/null" && say) say += ` → ${t("writes to {file}", { file: show(p.yazar) })}`;
    // where the output and the error messages go
    const notes = [];
    if (/(^|\s)2>&1/.test(p.metin)) notes.push(t("error messages go along with the output"));
    if (/(^|\s)2>\s*\/dev\/null/.test(p.metin)) notes.push(t("error messages are hidden"));
    if (/(^|[^2&\d])>\s*\/dev\/null/.test(p.metin)) notes.push(t("its output is hidden"));
    if (say && notes.length) say += ` (${notes.join(", ")})`;

  const before = p.sonra && JOINER[p.sonra] ? `<span class="baglac">${esc(JOINER[p.sonra]())}</span>` : "";
  return `<li>${before}<b class="${say ? "" : "bilinmiyor"}">${esc(say || t("A command this page doesn't know"))}</b><code>${esc(show(p.metin))}</code>${script}</li>`;
}
/** The command laid out one command to a line, each link (`&&`, `|`) at the end of its line, scripts in place. */

  switch (d.tur) {
    case "bash": body = commandHtml(d) + outputHtml(d); break;
    case "read": body = file + para([g.offset && t("from line {n}", { n: g.offset }), g.limit && t("{n} lines", { n: g.limit })].filter(Boolean).join(", ")) + resultBlock(d, lang); break;
    case "edit": body = file + (d.yama ? block(t("Change"), patchHtml(d.yama, lang)) : block(t("Before"), pre(g.old_string, "", lang)) + block(t("After"), pre(g.new_string, "", lang))) + failure; break;
    case "write": body = file + (d.yama ? block(t("Change"), patchHtml(d.yama, lang)) : block(t("Content"), pre(g.content, "", lang))) + failure; break;
    case "fetch": case "browser": body = block(t("Address"), `<p><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.url)}</a></p>`) + block(t("Question"), para(g.prompt)) + resultBlock(d); break;
    case "search": body = block(t("Search"), para(g.query)) + resultBlock(d); break;
    case "grep": case "glob": body = block(t("Pattern"), pre(g.pattern)) + block(t("Folder"), pre(g.path)) + resultBlock(d); break;
    case "agent": body = block(t("Task"), para(g.description)) + block(t("Instructions"), pre(g.prompt)) + resultBlock(d); break;
    default: body = block(t("Input"), pre(JSON.stringify(g, null, 2))) + resultBlock(d);
  }
  return `<div class="adim">${head}${body}${rawHtml(d)}</div>`;
}
async function openStep(id) {
  const session = panel.id;
  const popup = openPopup({ title: t("Step"), body: `<p class="soluk">${esc(t("Loading…"))}</p>`, wide: true });
  popup.element.classList.add("adim-pencere"); // as wide as it can be for diffs and output, only as tall as its content
  try {
    const d = await getJson(`./api/adim?oturum=${encodeURIComponent(session)}&id=${encodeURIComponent(id)}`);
    popup.element.querySelector(".popup-bas h2").textContent = stepTitle(d);
    popup.setBody(stepHtml(d));
  } catch {
    popup.setBody(`<p class="soluk">${esc(t("Could not load this step."))}</p>`);
  }
}

function drawPanel() {
  const box = $("#panel .oturum-panel"), inner = $("#panel .icerik");
  if (!inner || !panel) return;
  // a log reads from the bottom: it stays there while new lines come in, unless you scrolled up to read
  const fromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
  const atBottom = fromBottom < 80;
  inner.innerHTML = panelHtml();
  if (panel.fromBottom != null) {
    box.scrollTop = box.scrollHeight - box.clientHeight - panel.fromBottom; // earlier lines came in above
    panel.fromBottom = null;
  } else if (atBottom || !panel.shown) box.scrollTop = box.scrollHeight;
  if (panel.data) panel.shown = true;
}
async function loadPanel() {
  const p = panel;
  if (!p) return;
  clearTimeout(p.timer);
  if (!document.hidden && !isHidden()) {
    try {
      p.data = await getJson(`./api/etkinlik?oturum=${encodeURIComponent(p.id)}&son=${p.limit}`);
      p.error = "";
    } catch {
      p.error = t("Could not read this session.");
    }
    if (panel !== p) return;
    drawPanel();
  }
  p.timer = setTimeout(loadPanel, p.data?.canli || isLive(infoOf(p.id)) ? 3000 : 20000);
}
function closePanel() {
  if (!panel) return;
  clearTimeout(panel.timer);
  panel = null;
  $("#panel").innerHTML = "";
  $("#sayfa").classList.remove("panel-acik");
  draw();
}
function openPanel(id) {
  const same = panel?.id === id;
  closePanel();
  if (same) return; // a second click on the same desk closes it
  panel = { id, data: null, error: "", open: new Set(), timer: 0, limit: PAGE, shown: false, fromBottom: null };
  $("#panel").innerHTML = `<aside class="gpanel oturum-panel kayarak"><div class="icerik"></div></aside>`;
  $("#sayfa").classList.add("panel-acik");
  drawPanel();
  draw();
  loadPanel();
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && panel && !document.querySelector("dialog[open]")) closePanel();
});

// —— All sessions: the ones that went home or are older, as long as Claude Code keeps their logs.
let everySession = null, historyAt = 0, historyQuery = "", historyProject = "";
async function loadHistory() {
  historyAt = Date.now();
  try {
    everySession = await getJson("./api/gecmis");
  } catch {
    everySession ??= { oturumlar: [], saklama: 30, failed: true };
  }
  if (tab === "history") drawHistory();
}
function dayLabel(z) {
  const d = new Date(z * 1000), yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  if (isoDay(d) === isoDay(new Date())) return t("Today");
  if (isoDay(d) === isoDay(yesterday)) return t("Yesterday");
  return d.toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long" });
}
const historyShell = () => `<section class="gecmis"><div class="g-ust">
    <input type="search" id="g-ara" placeholder="${esc(t("Search sessions"))}" aria-label="${esc(t("Search sessions"))}" value="${esc(historyQuery)}">
    <select id="g-proje" aria-label="${esc(t("Project"))}"></select></div><div id="g-liste"></div><p class="soluk g-not" id="g-not"></p></section>`;
function drawHistory() {
  const list = $("#g-liste");
  if (!list) return;
  if (!everySession) return void (list.innerHTML = `<p class="soluk">${esc(t("Loading…"))}</p>`);
  const projects = [...new Set(everySession.oturumlar.map((s) => s.proje))].sort((a, b) => a.localeCompare(b, LOCALE));
  const select = $("#g-proje");
  if (select.dataset.projeler !== projects.join("\n")) {
    select.dataset.projeler = projects.join("\n");
    select.innerHTML = `<option value="">${esc(t("All projects"))}</option>${projects.map((p) => `<option value="${esc(p)}"${p === historyProject ? " selected" : ""}>${esc(p)}</option>`).join("")}`;
  }
  const q = historyQuery.trim().toLocaleLowerCase(LOCALE);
  const rows = everySession.oturumlar.filter((s) => (!historyProject || s.proje === historyProject) && (!q || `${s.baslik} ${s.proje}`.toLocaleLowerCase(LOCALE).includes(q)));
  let html = "", day = "";
  for (const s of rows) {
    const label = dayLabel(s.zaman), live = sessions.find((x) => x.oturum === s.oturum && isLive(x));
    if (label !== day) html += `<h3 class="g-gun">${esc((day = label))}</h3>`;
    html += `<button type="button" class="g-satir${panel?.id === s.oturum ? " secili" : ""}" data-gecmis="${esc(s.oturum)}">
      <span><b>${esc(s.baslik)}</b><small class="soluk">${esc(s.proje)} · ${esc(clock(s.zaman))}</small></span>${live ? `<span class="g-durum ${esc(live.durum)}">${esc(STATUS[live.durum])}</span>` : ""}</button>`;
  }
  list.innerHTML = html || `<p class="soluk">${esc(everySession.failed ? t("Could not reach the server.") : t("No sessions found."))}</p>`;
  $("#g-not").textContent = t("Claude Code keeps a session's log for {n} days, then deletes it. To keep them longer, set cleanupPeriodDays in its settings.", { n: everySession.saklama });
}
document.addEventListener("input", (e) => {
  if (e.target.id !== "g-ara") return;
  historyQuery = e.target.value;
  drawHistory();
});
document.addEventListener("change", (e) => {
  if (e.target.id !== "g-proje") return;
  historyProject = e.target.value;
  drawHistory();
});
// —— Cat: lives in its own layer, because the office below is redrawn every 10 seconds and would restart it.
const CAT_WIDTH = 84, CAT_HEIGHT = 54, WALK_SPEED = 70, RUN_SPEED = 280;
const CAT_COLORS = { O: "#d98a3f", o: "#b56a2a", E: "#2a1d17", W: "#f3efe6", P: "#e58a9b" };
const CAT_POSES = {
  "walk-a": ["O..O..........", "OOOO.......oo.", "EOEO.......oo.", "OPOO......oo..", "WOOOoOOOoOOo..", ".OOOOoOOOoOO..", ".OOOOOOOOOOO..", ".OO.O....O.OO.", ".WW.W....W.WW."],
  "walk-b": ["O..O..........", "OOOO........oo", "EOEO.......oo.", "OPOO......oo..", "WOOOoOOOoOOo..", ".OOOOoOOOoOO..", ".OOOOOOOOOOO..", "..OO.O..O.OO..", "..WW.W..W.WW.."],
  "sit-a": ["O..O..........", "OOOO..........", "EOEO..........", "OPOO..........", "WOOOOOo.......", ".OOOoOOo......", ".OOOOoOOo...oo", ".OOOOOOOOo.oo.", ".WW.WWOOOOOo.."],
  "sit-b": ["O..O..........", "OOOO..........", "EOEO..........", "OPOO..........", "WOOOOOo.......", ".OOOoOOo.....o", ".OOOOoOOo...oo", ".OOOOOOOOo.oo.", ".WW.WWOOOOOo.."],
  sleep: ["..............", "..............", "..............", "....oOOOoOOo..", "..OOOOOOOOOOO.", "O.OOOoOOOoOOOO", "OOOOOOOOOOOOOO", "ooOOOOOOOOOOoo", "WPOOOOOOOOooo."],
};
const calmCat = matchMedia("(prefers-reduced-motion:reduce)").matches;
const cat = { element: null, x: 0, y: 0, pose: "sit", timer: 0, petting: 0 };
const catLayer = () => $("#kedi-katman");
const catVisible = () => tab === "office" && has("cat") && !document.hidden && !isHidden();
const randomBetween = (low, high) => low + Math.random() * (high - low);
const catBounds = () => ({ width: Math.max(0, catLayer().clientWidth - CAT_WIDTH), height: Math.max(0, catLayer().clientHeight - CAT_HEIGHT) });
function catPose(pose) {
  cat.pose = pose;
  cat.element.dataset.poz = pose;
}
function catSay(text, kind = "") {
  const bubble = document.createElement("span");
  bubble.className = `kedi-balon ${kind}`;
  bubble.textContent = text;
  cat.element.append(bubble);
  setTimeout(() => bubble.remove(), 1300);
}
const catPlace = (x, y, ms = 0) => {
  cat.element.style.transition = ms ? `transform ${ms}ms linear` : "none";
  cat.element.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
};
function catGo(x, y, speed, then) {
  clearTimeout(cat.timer);
  const { width, height } = catBounds();
  x = Math.min(width, Math.max(0, x));
  y = Math.min(height, Math.max(0, y));
  const ms = (Math.hypot(x - cat.x, y - cat.y) / speed) * 1000;
  cat.element.classList.toggle("sag", x > cat.x);
  catPose(speed === RUN_SPEED ? "run" : "walk");
  catPlace(x, y, ms);
  cat.x = x;
  cat.y = y;
  cat.timer = setTimeout(() => { catPose("sit"); then(); }, ms);
}
/** Stops where it is right now, also in the middle of a walk. */
function catStop() {
  clearTimeout(cat.timer);
  const now = new DOMMatrix(getComputedStyle(cat.element).transform);
  cat.x = now.m41;
  cat.y = now.m42;
  catPlace(cat.x, cat.y);
  if (cat.pose !== "sleep") catPose("sit");
}
const catWait = (ms) => { clearTimeout(cat.timer); cat.timer = setTimeout(catLife, ms); };
/** What it does next: it sleeps more when nobody is working. Nothing happens while nobody can see it. */
function catLife() {
  if (!catVisible()) return catWait(5000);
  if (cat.petting) return;
  const working = sessions.some((s) => s.durum === "calisiyor"), roll = Math.random();
  if (roll < (working ? 0.15 : 0.45)) {
    catPose("sleep");
    return catWait(randomBetween(20000, 60000));
  }
  catPose("sit");
  if (calmCat || roll > 0.8) return catWait(randomBetween(4000, 12000));
  const { width, height } = catBounds();
  catGo(randomBetween(0, width), randomBetween(0, height), WALK_SPEED, () => catWait(randomBetween(4000, 12000)));
}
function catMeow() {
  const Sound = window.AudioContext;
  if (!Sound) return;
  const audio = new Sound(), voice = audio.createOscillator(), filter = audio.createBiquadFilter(), gain = audio.createGain(), now = audio.currentTime;
  voice.type = "sawtooth";
  voice.frequency.setValueAtTime(520, now);
  voice.frequency.linearRampToValueAtTime(860, now + 0.12);
  voice.frequency.linearRampToValueAtTime(460, now + 0.4);
  filter.frequency.value = 1500;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.06, now + 0.05);
  gain.gain.linearRampToValueAtTime(0.0001, now + 0.42);
  voice.connect(filter).connect(gain).connect(audio.destination);
  voice.start(now);
  voice.stop(now + 0.45);
  voice.onended = () => audio.close();
}
function catClicked() {
  catStop();
  if (cat.pose === "sleep") {
    catPose("sit");
    catSay("?");
  } else {
    cat.element.classList.remove("sevincli");
    void cat.element.offsetWidth; // so that the jump starts again
    cat.element.classList.add("sevincli");
    catSay(t("Meow!"));
    catMeow();
  }
  if (!cat.petting) catWait(6000);
}
/** Pointing at it is petting it: it stops and purrs, unless it is asleep. */
function catPetting(on) {
  clearInterval(cat.petting);
  cat.petting = 0;
  if (!on) return catWait(2500);
  catStop();
  const purr = () => { if (cat.pose !== "sleep") catSay("♥", "kalp"); };
  purr();
  cat.petting = setInterval(purr, 900);
}
/** A click on the floor: it runs there. */
function catFetch(event) {
  if (calmCat) return;
  const box = catLayer().getBoundingClientRect();
  catGo(event.clientX - box.left - CAT_WIDTH / 2, event.clientY - box.top - CAT_HEIGHT, RUN_SPEED, () => catWait(8000));
}
/** A session waiting for approval: it runs to that desk and tells you. */
let approvalsSeen = null;
function catNotice() {
  const waiting = sessions.filter((s) => s.durum === "onay").map((s) => s.oturum);
  const fresh = approvalsSeen ? waiting.filter((id) => !approvalsSeen.has(id)) : [];
  approvalsSeen = new Set(waiting);
  if (!fresh.length || !cat.element || !catVisible() || cat.petting || calmCat) return;
  const desk = document.querySelector(`[data-oturum="${CSS.escape(fresh[0])}"]`);
  if (!desk) return;
  const box = catLayer().getBoundingClientRect(), target = desk.getBoundingClientRect();
  catGo(target.right - box.left - CAT_WIDTH / 2, target.bottom - box.top - CAT_HEIGHT, RUN_SPEED, () => {
    catSay("!");
    catWait(15000);
  });
}
function catStart() {
  const element = document.createElement("div");
  element.className = "kedi";
  element.title = t("Cat");
  const frames = Object.entries(CAT_POSES).map(([pose, rows]) => `<g class="${pose}">${pixels(rows, CAT_COLORS)}</g>`).join("");
  element.innerHTML = `<span class="kedi-ic"><svg class="piksel" width="${CAT_WIDTH}" height="${CAT_HEIGHT}" viewBox="0 0 14 9" aria-hidden="true">${frames}</svg></span>`;
  element.addEventListener("pointerenter", () => catPetting(true));
  element.addEventListener("pointerleave", () => catPetting(false));
  catLayer().append(element);
  cat.element = element;
  const { width, height } = catBounds();
  cat.x = width - 32;
  cat.y = height - 16;
  catPlace(cat.x, cat.y);
  catPose("sit");
  catWait(3000);
}

// Nothing moves on a tab nobody is looking at.
document.addEventListener("visibilitychange", () => $("#sayfa").classList.toggle("durgun", document.hidden));

// —— Sound: the point of this applet, on its own tab: the office redraws every 10 seconds.
let sounds = null;
const PLAY_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const SOUND_EVENTS = [["done", () => t("When a session finishes")], ["approval", () => t("When it needs your approval")]];
const DOWN_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const soundName = (id) => sounds.options.find((s) => s.id === id)?.name ?? t("No sound");
function soundRow([event, label]) {
  const chosen = sounds.chosen[event];
  return `<div class="ses-satir"><span>${esc(label())}</span>
    <button type="button" class="ses-sec" data-choose="${event}" aria-haspopup="dialog">${esc(soundName(chosen))}${DOWN_ICON}</button>
    ${sounds.canPlay ? `<button type="button" data-play="${event}" title="${esc(t("Play"))}" aria-label="${esc(t("Play"))}"${chosen === sounds.none ? " disabled" : ""}>${PLAY_ICON}</button>` : ""}</div>`;
}
/** The sound list in its window: choosing plays the sound and the window stays, so sounds can be compared. */
function pickerHtml(event) {
  const chosen = sounds.chosen[event];
  const row = (id, name) => `<div class="ses-secenek${id === chosen ? " secili" : ""}">
      <button type="button" class="ses-ad" data-pick="${esc(id)}"><span class="ses-tik">${id === chosen ? ICON.check(14) : ""}</span>${esc(name)}</button>
      ${sounds.canPlay && id !== sounds.none ? `<button type="button" class="ses-cal" data-preview="${esc(id)}" title="${esc(t("Play"))}" aria-label="${esc(t("Play {name}", { name }))}">${PLAY_ICON}</button>` : ""}</div>`;
  const group = (title, list) => (list.length ? `<h3>${esc(title)}</h3>${list.map((s) => row(s.id, s.name)).join("")}` : "");
  return `<div class="ses-liste">${row(sounds.none, t("No sound"))}${group("Speys", sounds.options.filter((s) => s.speys))}${group(t("Your sounds"), sounds.options.filter((s) => s.own))}${group(t("System sounds"), sounds.options.filter((s) => !s.own && !s.speys))}</div>`;
}
function soundsHtml() {
  return `<section class="kart ses-kart"><h2>${esc(t("Sound"))}</h2>
    <p class="soluk ses-aciklama">${esc(t("Hear when Claude is done, without watching the tab."))}</p>
    ${SOUND_EVENTS.map(soundRow).join("")}
    ${sounds.canPlay ? "" : `<p class="soluk ses-not">${esc(t("Sounds and notifications work on macOS for now."))}</p>`}
    <p class="soluk ses-not">${t("To add your own, put an audio file in <code>{folder}</code>.", { folder: esc(sounds.folder) })}</p>
    <div class="ses-satir ses-kanca-satir"><span>${esc(t("Sound and notifications"))}<small>${esc(t("Runs through a Claude Code hook, added to its settings automatically."))}</small></span>
      <button type="button" class="ses-anahtar${sounds.hook ? " on" : ""}" role="switch" aria-checked="${sounds.hook}" aria-label="${esc(t("Sound and notifications"))}" data-hook></button></div>
    ${sounds.hookFailed.length ? `<p class="ses-not ses-hata">${esc(t("Could not read the settings in {folder}, so the hook wasn't added there.", { folder: sounds.hookFailed.join(", ") }))}</p>` : ""}</section>`;
}
async function loadSounds() {
  sounds = await getJson("./api/sounds");
  $("#sounds").innerHTML = soundsHtml();
}
const postSound = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" }, body: JSON.stringify(body) });
let picking = null;
document.addEventListener("click", async (e) => {
  const tabButton = e.target.closest("[data-sekme]");
  if (tabButton) {
    tab = tabButton.dataset.sekme;
    store("claude.tab", tab);
    return draw();
  }
  if (e.target.closest(".kedi")) return catClicked();
  const desk = e.target.closest("[data-oturum]") ?? e.target.closest("[data-gecmis]");
  if (desk) return openPanel(desk.dataset.oturum ?? desk.dataset.gecmis);
  if (e.target.closest("[data-panel-kapat]")) return closePanel();
  const stepItem = e.target.closest("[data-adim]");
  if (stepItem && panel) return openStep(stepItem.dataset.adim);
  const message = e.target.closest("[data-mesaj]");
  if (message && panel) {
    const key = message.dataset.mesaj;
    if (!panel.open.delete(key)) panel.open.add(key);
    return drawPanel();
  }
  if (e.target.closest("[data-eski]") && panel) {
    const box = $("#panel .oturum-panel");
    panel.fromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
    panel.limit += PAGE;
    return loadPanel();
  }
  if (e.target.closest(".zemin") && cat.element && has("cat")) return catFetch(e);
  if (e.target.closest("[data-esyalar]")) {
    furniturePopup = openPopup({ title: t("Office furniture"), body: furnitureHtml(), onClose: () => { furniturePopup = null; furnitureError = ""; } });
    return;
  }
  const item = e.target.closest("[data-esya]");
  if (item) return toggleFurniture(item.dataset.esya);
  if (e.target.closest("[data-hook]")) return postSound("./api/sounds/hook", { on: !sounds.hook }).then(loadSounds);
  const button = e.target.closest("[data-play]");
  if (button) return postSound("./api/sounds/play", { id: sounds.chosen[button.dataset.play] });
  const opener = e.target.closest("[data-choose]");
  if (opener) {
    const event = opener.dataset.choose;
    const popup = openPopup({ title: SOUND_EVENTS.find(([x]) => x === event)[1](), body: pickerHtml(event), onClose: () => (picking = null) });
    picking = { event, popup };
    popup.element.querySelector(".secili")?.scrollIntoView({ block: "center" });
    return;
  }
  const preview = e.target.closest("[data-preview]");
  if (preview) return postSound("./api/sounds/play", { id: preview.dataset.preview });
  const pick = e.target.closest("[data-pick]");
  if (!pick || !picking) return;
  const id = pick.dataset.pick, { event, popup } = picking;
  const r = await postSound("./api/sounds", { event, id });
  if (!r.ok) return notify(t("Could not save."));
  if (id !== sounds.none) postSound("./api/sounds/play", { id });
  await loadSounds();
  popup.setBody(pickerHtml(event));
});

function draw() {
  $("#sayfa").classList.toggle("tam", tab === "office");
  const tabs = $("#sekmeler");
  requestAnimationFrame(() => $("#sayfa").style.setProperty("--sekmeler-bitis", `${tabs.offsetLeft + tabs.offsetWidth + 12}px`));
  tabs.innerHTML = TABS.map(([id, label]) => `<button type="button" class="${id === tab ? "secili" : ""}" data-sekme="${id}">${esc(label())}</button>`).join("");
  $("#sounds").hidden = tab !== "sound";
  $("#icerik").hidden = tab === "sound";
  if (tab === "office") $("#icerik").innerHTML = officeHtml();
  else if (tab === "history") {
    if (!$("#g-liste")) $("#icerik").innerHTML = historyShell();
    if (!everySession && Date.now() - historyAt > 5000) loadHistory();
    drawHistory();
  }
  catLayer().hidden = tab !== "office" || !has("cat");
  if (!catLayer().hidden && !cat.element) catStart();
}
// Every few seconds while someone works, so the bubbles follow along; slower when the office is quiet.
let refreshTimer = 0;
async function refresh() {
  clearTimeout(refreshTimer);
  if (!isHidden()) {
    try {
      sessions = await getJson("./api/oturumlar");
      failed = false;
    } catch {
      failed = true;
    }
    draw();
    catNotice();
    drawPanel();
    if (tab === "history" && Date.now() - historyAt > 30_000) loadHistory();
  }
  refreshTimer = setTimeout(refresh, sessions.some(isLive) ? 4000 : 10000);
}
loadSounds().catch(() => {});
getJson("./api/office").then((d) => { furniture = d.items; }).catch(() => { furniture = FURNITURE.map(([id]) => id); }).finally(draw);
draw();
refresh();
window.addEventListener("focus", refresh);
</script>
