<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<link rel="stylesheet" href="/kit.css">
<style>
/* —— Speys's design language for the whole page: its colours (frontend app/globals.css --app-*), accent #6366F1, its
   typeface Geist (fonts/, OFL), one width for every section. kit.css's names point to Speys's values here, so the
   Company side and the personal side look like one app. */
@font-face{font-family:Geist;src:url(./fonts/geist-latin.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+20BA,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Geist;src:url(./fonts/geist-latin-ext.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--a-bg:#faf9f7;--a-surface:#fff;--a-muted-bg:#f3f4f6;--a-border:#f3f4f6;--a-text:#111827;--a-muted:#9ca3af;--a-track:#f3f4f6;--a-active:#fff;--accent:#6366F1;
  --bg:var(--a-bg);--yuzey:var(--a-surface);--yuzey2:var(--a-muted-bg);--cizgi:var(--a-border);--metin:var(--a-text);--soluk:var(--a-muted);--yesil:#10B981;--kirmizi:#EF4444;--vurgu:#6366F1}
@media (prefers-color-scheme:dark){:root{--a-bg:#09090b;--a-surface:#18181b;--a-muted-bg:#27272a;--a-border:#27272a;--a-text:#fafafa;--a-muted:#a1a1aa;--a-track:#27272a;--a-active:#3f3f46}}
body{font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--a-bg);color:var(--a-text);-webkit-font-smoothing:antialiased}
main{max-width:1080px;padding:12px 16px 32px}
section.kart{border-radius:16px;border-color:var(--a-border);background:var(--a-surface);padding:16px}
section.kart h2{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--a-muted)}
/* a section's tabs: in the header row on the web (Speys's UstSekmeler), in a bar at the bottom on phones */
.pk-baslik-serit,.pk-altbar{display:none}
@media (max-width:767px){
  .pk-altbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--a-bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--a-border)}
  .pk-altbar>div{max-width:576px;margin:0 auto;display:flex;padding:6px 8px}
  .pk-altbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;color:var(--a-muted);text-decoration:none;min-width:0}
  .pk-altbar a span{padding:6px;border-radius:8px;display:grid}
  .pk-altbar svg{width:20px;height:20px}
  .pk-altbar b{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;white-space:nowrap}
  .pk-altbar a.on{color:var(--a-text)}
  .pk-altbar a.on span{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
  .pk-altbar{display:block}
  main{padding-bottom:104px}
}
@media (min-width:768px){
  .pk-baslik-serit{display:flex;align-items:stretch;gap:16px;max-width:1080px;margin:-4px auto 18px;border-bottom:1px solid var(--a-border);min-height:46px}
  .pk-baslik-serit>b{display:flex;align-items:center;font-size:17px;font-weight:900;letter-spacing:-.01em;padding-right:4px}
  .pk-baslik-serit nav{display:flex;align-items:stretch;gap:4px}
  .pk-baslik-serit a{position:relative;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:700;color:var(--a-muted);text-decoration:none}
  .pk-baslik-serit a:hover{color:var(--a-text)}
  .pk-baslik-serit a svg{width:16px;height:16px}
  .pk-baslik-serit a.on{color:var(--a-text)}
  .pk-baslik-serit a.on svg{color:var(--accent)}
  .pk-baslik-serit a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .pk-baslik-serit{display:flex}
}
/* a month, as Speys's Ledger: ‹ November 2026 › in the middle */
.ks-rakamlar{gap:12px}
.ks-rakamlar section.kart{display:flex;flex-direction:column;gap:2px}
.ks-rakamlar .ks-etiket{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--a-muted)}
.ks-rakamlar b{font-size:22px;font-weight:900;letter-spacing:-.02em}
.ks-rakamlar small:last-child{font-size:12px;font-weight:600;color:var(--a-muted)}
.pk-baslik-serit .ks-senkron{margin-left:auto;align-self:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--a-muted);margin-right:0}
.ks-senkron-tel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;margin:0 0 12px}
@media (min-width:768px){.ks-senkron-tel{display:none}}
.ks-dugme,.ks-ust button{border-radius:10px;border-color:var(--a-border);background:var(--a-surface)}
.ks-kaydet{background:var(--accent);border-color:var(--accent)}
.sp-ay{display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:700;color:var(--a-muted);margin:0 0 14px}
.sp-ay span{color:var(--a-text);text-transform:capitalize;min-width:120px;text-align:center}
.sp-ay button{width:28px;height:28px;border:0;background:none;border-radius:8px;color:var(--a-muted);font-size:16px;font-weight:700;cursor:pointer}
.sp-ay button:hover{background:var(--a-muted-bg);color:var(--a-text)}

.ks-ust{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.ks-ust h1{font-size:18px;margin:0}
.ks-senkron{margin-right:auto;font-size:12px;color:var(--soluk)}
.ks-ust button,.ks-dugme{border:1px solid var(--cizgi);background:var(--yuzey);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;color:var(--metin)}
.ks-ay{min-width:112px;text-align:center;font-weight:600}
.ks-rakamlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.ks-rakamlar b{display:block;font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums}
.ks-rakamlar small{display:block;font-size:12px}
.ks-kat{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:8px;align-items:center;width:calc(100% + 12px);padding:4px 6px;margin:0 -6px;border:0;background:none;border-radius:6px;text-align:left;font-size:13px}
.ks-kat:hover,.ks-kat.secili{background:var(--yuzey2)}
.ks-kat div{height:8px;background:var(--yuzey2);border-radius:99px;overflow:hidden}
.ks-kat.secili div{background:var(--cizgi)}
.ks-kat i{display:block;height:100%;background:var(--vurgu);border-radius:99px}
.ks-kat span:last-child,.ks-tutar{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ks-baslik{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ks-baslik h2{margin:0 auto 0 0}
.ks-satir{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--cizgi)}
.ks-satir:last-child{border-bottom:0}
.ks-satir small{display:block}
.ks-satir.kapali{opacity:.55}
/* the app strip at the top, as Speys's (frontend components/home/MisafirAlanSeridi.tsx): the wordmark, a line,
   then the sections; the active one bright with a short bar under it */
.ks-serit{display:flex;align-items:center;gap:8px;margin:-4px 0 16px;padding-bottom:6px;border-bottom:1px solid var(--cizgi)}
.ks-logo img{height:26px;display:block}
.ks-serit-cizgi{width:1px;height:32px;background:var(--cizgi);flex-shrink:0}
.ks-serit nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.ks-serit nav::-webkit-scrollbar{display:none}
.ks-serit nav button{width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 0;border:0;background:none;font:inherit;color:color-mix(in srgb,var(--soluk) 70%,transparent);cursor:pointer}
.ks-serit nav button svg{width:22px;height:22px}
.ks-serit nav button span{font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ks-serit nav button i{width:20px;height:3px;border-radius:99px;background:transparent}
.ks-serit nav button.aktif{color:var(--metin)}
.ks-serit nav button.aktif i{background:var(--metin)}
@media (min-width:900px){.ks-serit nav button{width:76px}.ks-serit nav button span{font-size:11px}}
.ks-kalemler{margin-top:4px;max-height:360px;overflow:auto}
.ks-kalem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--cizgi);font-size:13px}
.ks-kalem:last-child{border-bottom:0}
.ks-kalem.bitti span:first-child{text-decoration:line-through;color:var(--soluk)}
.ks-kalem small{color:var(--soluk);margin-left:6px}
.ks-ac{border:0;background:none;padding:0;text-align:left;min-width:0;font-size:14px}
.ks-gelir{color:var(--yesil)}
.ks-kucuk{border:0;background:none;padding:2px 6px;font-size:12px;color:var(--soluk);border-radius:6px}
.ks-kucuk:hover{background:var(--yuzey2);color:var(--metin)}
.ks-form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;margin-bottom:12px}
.ks-form.dar{grid-template-columns:repeat(2,minmax(0,1fr))}
.ks-form label{display:grid;gap:3px;font-size:12px;color:var(--soluk);min-width:0}
.ks-form input,.ks-form select{width:100%;min-width:0;border:1px solid var(--cizgi);background:var(--bg);color:var(--metin);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.ks-genis{grid-column:span 2}
.ks-tum{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ks-tum .ks-onay{display:flex;align-items:center;gap:5px;font-size:13px}
.ks-tum .ks-onay input{width:auto}
.ks-tum .segment{margin-left:0}
.ks-sag{margin-left:auto;display:flex;gap:6px}
.ks-kaydet{background:var(--vurgu);border-color:var(--vurgu);color:#fff;font-weight:600}
.ks-yil{display:flex;align-items:flex-end;height:164px}
.ks-yil button{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:0;background:none;padding:0 2px;font-size:10px;color:var(--soluk);min-width:0;border-radius:6px 6px 0 0}
.ks-yil button:hover,.ks-yil button.secili{background:var(--yuzey2)}
.ks-yil button.ceyrek{border-left:1px solid var(--cizgi)}
.ks-yil button.ceyrek>span{font-weight:600}
.ks-yil button>span{display:block;margin-top:3px;text-align:center}
.ks-yil button.secili>span{color:var(--metin);font-weight:600}
.ks-yil button>.ks-yil-ciftler{display:flex;align-items:flex-end;gap:2px;justify-content:center;margin:0}
.ks-yil-sutun{flex:1;max-width:16px;display:flex;flex-direction:column;justify-content:flex-end}
.ks-yil-sutun i{display:block;background:var(--renk)}
.ks-yil-sutun i.bos{height:2px;opacity:.35}
.ks-yil-sutun i.beklenen{background:color-mix(in srgb,var(--renk) 12%,transparent);border:1px dashed var(--renk);border-bottom-width:0;border-radius:2px 2px 0 0}
.ks-lejant{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11px;color:var(--soluk)}
.ks-lejant i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--renk)}
.ks-lejant i.beklenen{background:none;border:1px dashed var(--soluk)}
.ks-tablo-kap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.ks-tablo{width:100%;table-layout:auto;border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
.ks-tablo th,.ks-tablo td{padding:5px 6px;text-align:right;white-space:nowrap;font-weight:400;border:0}
.ks-tablo th:first-child,.ks-tablo td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--yuzey)}
.ks-tablo th:last-child,.ks-tablo td:last-child{position:sticky;right:0;z-index:1;background:var(--yuzey);font-weight:600}
.ks-tablo thead th{color:var(--soluk);font-size:11px}
.ks-tablo .ceyrek-bas{font-weight:600;color:var(--metin);text-align:right}
.ks-tablo .sinir{padding-left:26px} /* quarters are separated by space, not a line */
.ks-tablo .ay-baslik{border-bottom:1px solid var(--cizgi)}
.ks-tablo .ay-baslik button{border:0;background:none;padding:0;font:inherit;color:inherit}
.ks-tablo .ay-baslik button:hover{color:var(--metin);text-decoration:underline}
.ks-tablo .grup td{padding-top:12px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--soluk)}
.ks-tablo .kalem td:first-child{padding-left:18px}
.ks-tablo .toplam td{font-weight:600}
.ks-tablo .net td{font-weight:700;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--cizgi)}
.ks-tablo .kumulatif td{color:var(--soluk)}
.ks-tablo td.tahmin{color:var(--soluk)}
.ks-tablo .net td.tahmin{color:var(--metin)}
.ks-tablo .eksi,.ks-tablo .net td.eksi{color:var(--kirmizi)}
.ks-tablo th.bugun-ay,.ks-tablo th.bugun-ay button{color:var(--vurgu);font-weight:600}
.ks-dipnot{margin:10px 0 0;font-size:12px;color:var(--soluk)}
.ks-senkron button{margin-left:6px}
.ks-senkron select{border:1px solid var(--cizgi);background:var(--bg);color:var(--metin);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px}
.ks-sorun{margin-bottom:16px}
.ks-sorun h3{font-size:13px;margin:12px 0 6px}
.ks-sorun h3:first-of-type{margin-top:4px}
.ks-cakisma{border-top:1px solid var(--cizgi);padding:8px 0}
.ks-cakisma table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.ks-cakisma td,.ks-cakisma th{padding:4px 6px;text-align:left;font-weight:400}
.ks-cakisma th{font-size:11px;color:var(--soluk)}
.ks-cakisma label{display:flex;gap:6px;align-items:center}
.ks-cift{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--cizgi);padding:8px 0;font-size:13px}
.ks-cift small{display:block}
@media (max-width:760px){.ks-cift{grid-template-columns:1fr}}
.ks-ek{grid-column:1/-1}
.ks-ek summary{font-size:12px;color:var(--soluk);cursor:pointer;width:max-content}
.ks-ek .ks-form{margin:8px 0 0}
.ks-ek .ks-onay{display:flex;align-items:center;gap:5px;height:31px;font-size:13px;color:var(--metin)}
.ks-ek .ks-onay input{width:auto}
@media (max-width:760px){.ks-form{grid-template-columns:repeat(2,minmax(0,1fr))}.ks-kat{grid-template-columns:96px minmax(0,1fr) 84px}}
</style>
</head>
<body>

<main id="icerik"></main>
<script src="/kit.js"></script>
<script>
"use strict";

document.title = "Finances";

const MONTHS = [t("January"), t("February"), t("March"), t("April"), t("May"), t("June"), t("July"), t("August"), t("September"), t("October"), t("November"), t("December")];
// The keys match Speys's Ledger (`hukuk` too, since 9 November 2026), so they line up when synced.
const CATEGORY = {
  malzeme: t("Materials"), kira: t("Rent"), personel: t("Staff"), fatura: t("Bills"), ekipman: t("Equipment"), pazarlama: t("Marketing"),
  yazilim: t("Software and subscriptions"), muhasebe: t("Accounting and financial advisor"), hukuk: t("Lawyer and legal"), sgk: t("Social security premium (Bağ-Kur / SGK)"),
  vergi: t("Taxes and fees (stamp duty etc.)"), vergi_odeme: t("Tax payment (VAT, income, provisional)"), ortak_cekis: t("Owner withdrawal"),
  satis: t("Sales"), hizmet: t("Services"), sermaye: t("Capital"), other: t("Other"),
};
const CATEGORIES = {
  out: ["yazilim", "pazarlama", "malzeme", "kira", "personel", "fatura", "ekipman", "muhasebe", "hukuk", "sgk", "vergi", "vergi_odeme", "ortak_cekis", "other"],
  in: ["hizmet", "satis", "sermaye", "other"],
};
const VAT_RATES = [0, 1, 10, 20];
const FX = ["USD", "EUR", "GBP"];
const CYCLES = { monthly: t("monthly"), quarterly: t("every three months"), yearly: t("yearly") };
const MONTHLY_SHARE = { monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 };
const PLAN_CYCLES = { once: t("one time"), monthly: t("every month"), quarterly: t("every three months"), yearly: t("every year") };
const monthName = (ym) => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const thisMonth = () => `${today.getFullYear()}-${pad2(today.getMonth() + 1)}`;
const selectedMonth = () => `${state.year}-${pad2(state.month + 1)}`;
const nextMonth = () => { const d = new Date(today.getFullYear(), today.getMonth() + 1, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };

const today = new Date();
const state = { year: today.getFullYear(), month: today.getMonth(), category: "", direction: "out", form: null, scenario: null, yearEnd: false, taxForm: false };
// form: { kind: "entry" | "rule" | "plan", record: the one being edited or null }
let data = null, error = "", loadSeq = 0;
// Speys: the connection, the chosen ledger, what needs an answer. Null until asked; the page works without it.
let speys = null, businesses = null, syncing = false;

const pad2 = (n) => String(n).padStart(2, "0");
const monthStart = () => `${state.year}-${pad2(state.month + 1)}-01`;
const monthEnd = () => `${state.year}-${pad2(state.month + 1)}-${pad2(new Date(state.year, state.month + 1, 0).getDate())}`;
const inCurrentMonth = () => state.year === today.getFullYear() && state.month === today.getMonth();
const todayIso = () => `${today.getFullYear()}-${pad2(today.getMonth() + 1)}-${pad2(today.getDate())}`;
const currency = () => data?.currency || "";
const tl = (n) => /^(TL|TRY|₺)$/i.test(currency()) ? new Intl.NumberFormat(LOCALE, { style: "currency", currency: "TRY", maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 }).format(+n || 0) : (+n || 0).toLocaleString(LOCALE, { maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 }) + " " + currency();
const dayLabel = (s) => { const [y, m, d] = s.split("-"); return `${+d} ${MONTHS[+m - 1]}${+y === state.year ? "" : " " + y}`; };
const categoryName = (k) => CATEGORY[k] || CATEGORY.other;
const categoryOptions = (direction, selected) => [...CATEGORIES[direction], ...(selected && !CATEGORIES[direction].includes(selected) ? [selected] : [])]
  .map((k) => `<option value="${esc(k)}" ${k === (selected ?? CATEGORIES[direction][0]) ? "selected" : ""}>${esc(categoryName(k))}</option>`).join("");

// The app's four sections, on a strip at the top as Speys's app strip (frontend components/home/MisafirAlanSeridi.tsx):
// Home (the summary, the default), Spending (the personal Ledger; its menu: statement, accounts), Company (the business
// ledger: sirket, finans, plan, duzenli, vergi; "finans", "plan", "duzenli", "vergi" stay as addresses so older links
// keep working) and Investments. The personal parts are drawn by personal-page.js.
const PERSONAL_TABS = ["home", "islemler", "harcamalar", "butce", "abonelik", "yatirim", "gecmis", "ekstre", "hesaplar"];
const COMPANY_TABS = ["sirket", "finans", "plan", "duzenli", "vergi"];
const activeTab = () => {
  const sub = decodeURIComponent(location.hash.slice(1)).split("/")[1] || "home";
  if (sub === "kisisel") return "harcamalar";
  if (sub === "sirket") return "monthly";
  return [...PERSONAL_TABS, ...COMPANY_TABS].includes(sub) ? sub : "home";
};
const sectionOf = (tab) => (["home", "islemler"].includes(tab) ? "home" : ["yatirim", "gecmis"].includes(tab) ? "yatirim" : ["harcamalar", "butce", "abonelik", "ekstre", "hesaplar"].includes(tab) ? "harcamalar" : "sirket");
const ICONS = {
  home: '<path d="M12 3.2 3 10.4V20a1 1 0 0 0 1 1h5.5v-6h5v6H20a1 1 0 0 0 1-1v-9.6L12 3.2Z"/>',
  harcamalar: '<path d="M5 2.5h14a1 1 0 0 1 1 1V21l-2.7-1.6L14.6 21 12 19.4 9.4 21l-2.7-1.6L4 21V3.5a1 1 0 0 1 1-1Zm3 5.5v1.8h8V8H8Zm0 4v1.8h5.5V12H8Z"/>',

const FIELD = {
  title: t("Title"), amount: t("Amount ({currency})", { currency: "" }).replace(/\s*\(\s*\)/, ""), category: t("Category"), entryDate: t("Date"),
  counterparty: t("To / from"), status: t("Status"), note: t("Note"), vatRate: t("VAT"), vatIncluded: t("VAT included"),

  dayOfMonth: t("Day of the month"), monthOfYear: t("Month"), isActive: t("Active"), autoPaid: t("Paid automatically"),
};
function fieldValue(field, v) {
  if (field === "deletedAt") return v ? t("deleted") : t("kept");
  if (v === null || v === undefined || v === "") return "–";
  if (typeof v === "boolean") return v ? t("yes") : t("no");
  if (field === "category") return categoryName(v);
  if (field === "amount" || field === "withholding") return tl(v);
  if (field === "entryDate") return dayLabel(v);
  if (field === "status") return v === "pending" ? t("Unpaid") : t("Paid");
  return String(typeof v === "object" ? JSON.stringify(v) : v);
}

/** What syncing needs from the user: conflicts, possible copies, records Speys didn't take. Nothing when all is well. */
function syncCard() {
  if (!speys) return "";
  const { conflicts = [], duplicates = [], failed = [] } = speys;
  if (!conflicts.length && !duplicates.length && !failed.length) return "";
  const what = (r) => `${esc(r.title ?? "")}<small class="soluk">${r.entryDate ? esc(dayLabel(r.entryDate)) + " · " : ""}${r.amount != null ? tl(r.amount) : ""}${r.counterparty ? " · " + esc(r.counterparty) : ""}</small>`;
  return `<section class="kart ks-sorun">
    <h2>${esc(t("Syncing with Speys"))}</h2>
    ${conflicts.length ? `<h3>${esc(t("Changed in both places"))}</h3>
      <p class="soluk" style="font-size:12px;margin:0 0 4px">${esc(t("The same field was changed here and in Speys. Nothing is sent until you choose; other changes went through."))}</p>
      ${conflicts.map((c) => `<form class="ks-cakisma" data-conflict="${esc(c.id)}" data-key="${esc(c.key)}">
        <b>${esc(c.local?.title || c.remote?.title || "")}</b>
        <table><tr><th></th><th>${esc(t("On this computer"))}</th><th>${esc(t("In Speys"))}</th></tr>
        ${c.fields.map((f) => `<tr><td class="soluk">${esc(FIELD[f.field] ?? f.field)}</td>
          <td><label><input type="radio" name="${esc(f.field)}" value="local" checked> ${esc(fieldValue(f.field, f.local))}</label></td>
          <td><label><input type="radio" name="${esc(f.field)}" value="remote"> ${esc(fieldValue(f.field, f.remote))}</label></td></tr>`).join("")}
        </table><button class="ks-dugme ks-kaydet">${esc(t("Keep the chosen ones"))}</button></form>`).join("")}` : ""}
    ${duplicates.length ? `<h3>${esc(t("Possible copies"))}</h3>
      <p class="soluk" style="font-size:12px;margin:0 0 4px">${esc(t("Same amount, close dates, similar names: the same payment may have been entered twice."))}</p>
      ${duplicates.map((d) => `<div class="ks-cift">
        <span>${what(d.a)}<button class="ks-kucuk" data-is="dup-drop" data-id="${esc(d.a.id)}">${esc(t("Delete this one"))}</button></span>
        <span>${what(d.b)}<button class="ks-kucuk" data-is="dup-drop" data-id="${esc(d.b.id)}">${esc(t("Delete this one"))}</button></span>
        <button class="ks-kucuk" data-is="dup-keep" data-key="${esc(d.key)}">${esc(t("Not a copy"))}</button></div>`).join("")}` : ""}
    ${failed.length ? `<h3>${esc(t("Not taken by Speys"))}</h3>
      ${failed.map((f) => `<div class="ks-satir"><span>${esc(f.title || f.id)}<small class="soluk">${esc(f.reason)}</small></span><span></span><span></span></div>`).join("")}
      <p class="soluk" style="font-size:12px;margin:6px 0 0">${esc(t("Fix the record here; it is sent again on the next sync."))}</p>` : ""}
  </section>`;
}

async function speysPost(path, body = {}) {
  const r = await fetch(`./api/speys/${path}`, { method: "POST", headers: { "Content-Type": "application/json", "x-panel": "1" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || t("Speys returned {status}.", { status: r.status }));
  return d;
}

async function loadSpeys() {
  try {
    const r = await fetch("./api/speys", { cache: "no-store" });
    if (r.ok) speys = await r.json();
    if (speys?.connected && !speys.business && !businesses) {
      businesses = (await speysPost("businesses")).businesses ?? [];
    }
  } catch (e) {
    if (speys) speys.lastError = e.message;
  }
  render();
}

/** Runs a sync (the server skips it if one ran a moment ago and nothing changed here), then shows the result. */
async function syncNow(force = false) {
  if (!speys?.connected || !speys.business || syncing) return;
  syncing = true;
  render();
  try {
    const d = await speysPost("sync", { force });
    speys = d;
    if (d.report && (d.report.pulled || d.report.pushed)) await load();
  } catch (e) {
    notify(e.message);
    await loadSpeys();
  } finally {
    syncing = false;
    render();
  }
}

async function load() {
  const seq = ++loadSeq;
  const q = new URLSearchParams({ from: monthStart(), to: monthEnd(), year: state.year, ...(state.scenario ? { scenario: state.scenario } : {}), ...(state.yearEnd ? { yearEnd: "1" } : {}) });
  try {
    const r = await fetch(`./api/kasa?${q}`, { cache: "no-store" });
    const d = await r.json();
    if (seq !== loadSeq) return;
    if (r.ok) { data = d; error = ""; } else error = d.error || t("Ledger returned {status}.", { status: r.status });
  } catch (e) {
    if (seq !== loadSeq) return;
    error = t("Could not read the ledger: {message}", { message: e.message });
  }
  render();
}

async function write(path, body, doneMessage) {
  try {
    const r = await fetch(`./api/${path}`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-panel": "1" }, body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return notify(d.error || t("Could not save ({status})", { status: r.status }));
    if (doneMessage) notify(doneMessage);
    state.form = null;
    await load();
    syncNow();
  } catch (e) {
    notify(t("Could not save: {message}", { message: e.message }));
  }
}

  const text = (k) => (f.has(k) ? f.get(k) : undefined);

    vatRate: num("vatRate"), vatIncluded: !!f.get("vatIncluded"), withholding: num("withholding"), invoiceNo: text("invoiceNo"),
    currency: text("currency"), originalAmount: num("originalAmount"), fxRate: num("fxRate"), paidBy: text("paidBy"),
  };
  return Object.fromEntries(Object.entries(out).filter(([, v]) => v !== undefined));
}

const COLOR = { income: "#10B981", expense: "#EF4444" };

/** Four quarters from the start of this one, income and expense side by side each month: solid actual, dashed expected. Quarter starts are ruled. */
function quarterChart(f) {
  const most = Math.max(1, ...f.flatMap((m) => [m.expense + m.expectedExpense, m.income + m.expectedIncome]));
  const barHeight = (amount) => Math.max(3, Math.round((136 * amount) / most));
  const bar = (color, actual, expected) => `<span class="ks-yil-sutun" style="--renk:${color}">
    ${expected ? `<i class="beklenen" style="height:${barHeight(expected)}px"></i>` : ""}
    ${actual ? `<i style="height:${barHeight(actual)}px"></i>` : expected ? "" : `<i class="bos"></i>`}</span>`;
  return `<div class="ks-yil">${f.map((m) => {
    const month = +m.ym.slice(5, 7), quarterStart = (month - 1) % 3 === 0;
    const tip = `${monthName(m.ym)} · ${t("income {amount}", { amount: tl(m.income) })}${m.expectedIncome ? ` + ${t("{amount} expected", { amount: tl(m.expectedIncome) })}` : ""} · ${t("expense {amount}", { amount: tl(m.expense) })}${m.expectedExpense ? ` + ${t("{amount} expected", { amount: tl(m.expectedExpense) })}` : ""}`;
    return `<button class="${m.ym === selectedMonth() ? "secili" : ""}${quarterStart ? " ceyrek" : ""}" data-is="month-pick" data-ym="${m.ym}" title="${esc(tip)}">
      <span class="ks-yil-ciftler">${bar(COLOR.income, m.income, m.expectedIncome)}${bar(COLOR.expense, m.expense, m.expectedExpense)}</span>
      <span>${esc(MONTHS[month - 1].slice(0, 3))}</span></button>`;
  }).join("")}</div>
  <div class="ks-lejant"><span><i style="--renk:${COLOR.income}"></i>${esc(t("income"))}</span><span><i style="--renk:${COLOR.expense}"></i>${esc(t("expense"))}</span><span><i class="beklenen"></i>${esc(t("dashed: expected"))}</span></div>`;
}

/** An amount in the table: no cents, no currency; negatives in brackets as in accounting, zero as a dash. */
const figure = (n) => {
  const r = Math.round(n);
  if (!r) return "–";
  const s = Math.abs(r).toLocaleString(LOCALE);
  return r < 0 ? `(${s})` : s;
};

/** Income statement: rows are categories, columns are months and quarters; a cell that includes expected amounts is faded. */
function financeTable(f) {
  const cell = (value, estimated, i, extra = "") => {
    const m = f[i];
    return `<td class="${(+m.ym.slice(5, 7) - 1) % 3 === 0 ? "sinir " : ""}${m.ym === thisMonth() ? "bugun-ay " : ""}${estimated ? "tahmin " : ""}${value < 0 ? "eksi " : ""}${extra}">${figure(value)}</td>`;
  };
  const rows = (direction) => {
    const categories = [...new Set(f.flatMap((m) => m.lines.filter((l) => l.direction === direction).map((l) => l.category)))];
    const totalOf = (k) => f.reduce((sum, m) => { const l = m.lines.find((x) => x.direction === direction && x.category === k); return sum + (l ? l.actual + l.expected : 0); }, 0);
    return categories.sort((a, b) => totalOf(b) - totalOf(a)).map((k) => {
      const cells = f.map((m, i) => {
        const l = m.lines.find((x) => x.direction === direction && x.category === k);
        return cell(l ? l.actual + l.expected : 0, !!l?.expected, i);
      }).join("");
      return `<tr class="kalem"><td>${esc(categoryName(k))}</td>${cells}<td class="sinir">${figure(totalOf(k))}</td></tr>`;
    }).join("");
  };
  const totalRow = (rowClass, label, valueFn, estimatedFn) => {
    const values = f.map(valueFn), total = values.reduce((a, b) => a + b, 0);
    return `<tr class="${rowClass}"><td>${esc(label)}</td>${values.map((d, i) => cell(d, estimatedFn(f[i]), i)).join("")}<td class="sinir ${total < 0 ? "eksi" : ""}">${figure(total)}</td></tr>`;
  };
  // Cell by cell: a merged row would break the quarter lines and this month's highlight here.
  const groupRow = (label) => `<tr class="grup"><td>${esc(label)}</td>${f.map((m) => `<td class="${(+m.ym.slice(5, 7) - 1) % 3 === 0 ? "sinir " : ""}${m.ym === thisMonth() ? "bugun-ay" : ""}"></td>`).join("")}<td class="sinir"></td></tr>`;
  const income = (m) => m.income + m.expectedIncome, expense = (m) => m.expense + m.expectedExpense;
  let running = Number(data.scenario?.openingBalance) || 0; // the scenario's opening balance starts the running total
  const cumulative = f.map((m) => (running += income(m) - expense(m)));
  const quarters = [0, 3, 6, 9].map((i) => {
    const year = f[i].ym.slice(0, 4), month = +f[i].ym.slice(5, 7);
    return `<th colspan="3" class="ceyrek-bas sinir">${esc(t("Q{quarter} {year}", { quarter: Math.ceil(month / 3), year }))}</th>`;
  }).join("");
  return `<div class="ks-tablo-kap"><table class="ks-tablo">
    <thead>
      <tr><th></th>${quarters}<th class="sinir"></th></tr>
      <tr><th class="ay-baslik">${esc(currency())}</th>${f.map((m) => `<th class="ay-baslik ${(+m.ym.slice(5, 7) - 1) % 3 === 0 ? "sinir" : ""} ${m.ym === thisMonth() ? "bugun-ay" : ""}"><button data-is="month-pick" data-ym="${m.ym}">${esc(MONTHS[+m.ym.slice(5, 7) - 1].slice(0, 3))}</button></th>`).join("")}<th class="ay-baslik sinir">${esc(t("Total"))}</th></tr>
    </thead>
    <tbody>
      ${groupRow(t("INCOME"))}
      ${rows("in")}
      ${totalRow("toplam", t("Total income"), income, (m) => m.expectedIncome > 0)}
      ${groupRow(t("EXPENSES"))}
      ${rows("out")}
      ${totalRow("toplam", t("Total expenses"), expense, (m) => m.expectedExpense > 0)}
      ${totalRow("net", t("Net profit / loss"), (m) => income(m) - expense(m), (m) => m.expectedIncome > 0 || m.expectedExpense > 0)}
      <tr class="kumulatif"><td>${esc(t("Cumulative"))}</td>${cumulative.map((d, i) => cell(d, f[i].expectedIncome > 0 || f[i].expectedExpense > 0, i)).join("")}<td class="sinir"></td></tr>
    </tbody>
  </table></div>
  <p class="ks-dipnot">${esc(t("Faded figures include expected amounts: an unpaid entry, a recurring payment or a plan. Amounts without VAT; capital put in, owner withdrawals and tax payments aren't counted."))}</p>`;
}

function render() {
  const root = $("#icerik");
  if (!data) { root.innerHTML = error ? `<section class="kart"><p>${esc(error)}</p></section>` : `<p class="bos">${esc(t("Loading…"))}</p>`; return; }
  const { summary: s, entries, pending, upcoming, monthly, rules, plans, forecast, expected } = data;
  const expectedRow = (b) => `<div class="ks-satir">
      <span>${esc(b.title)}<small class="soluk">${b.date ? esc(dayLabel(b.date)) + " · " + esc(t("recurring")) : esc(t("plan"))} · ${esc(categoryName(b.category))}</small></span><span></span>
      <span class="ks-tutar ${b.direction === "in" ? "ks-gelir" : ""}">${b.direction === "in" ? "+" : "−"}${tl(b.amount)}</span>
    </div>`;

  const previous = state.month > 0 ? monthly[state.month - 1].expense : 0;
  const change = previous && selectedMonth() <= thisMonth() ? Math.round((100 * (s.expense - previous)) / previous) : null; // a future month is not compared yet
  const expenseRules = rules.filter((r) => r.isActive && r.direction === "out");
  const recurringExpense = expenseRules.reduce((sum, r) => sum + r.amount * MONTHLY_SHARE[r.cycle], 0);
  const recurringIncome = rules.filter((r) => r.isActive && r.direction === "in").reduce((sum, r) => sum + r.amount * MONTHLY_SHARE[r.cycle], 0);
  const unpaidDebt = pending.filter((e) => e.direction === "out").reduce((sum, e) => sum + e.amount, 0);
  const receivable = pending.filter((e) => e.direction === "in").reduce((sum, e) => sum + e.amount, 0);

  const expenses = entries.filter((e) => e.direction === "out" && e.status === "paid" && e.operating);
  const byCategory = Object.entries(expenses.reduce((sums, e) => (sums[e.category] = (sums[e.category] || 0) + e.net, sums), {})).sort((a, b) => b[1] - a[1]);
  const largest = byCategory[0]?.[1] || 1;
  const list = state.category ? entries.filter((e) => e.category === state.category) : entries;
  const uncollected = entries.filter((e) => e.direction === "in" && e.status === "pending" && e.operating).reduce((sum, e) => sum + e.net, 0);
  const vatNet = s.vatCollected - s.vatPaid;
  const monthlyShare = (r) => r.amount * MONTHLY_SHARE[r.cycle];

  const entryRow = (e) => `<div class="ks-satir">
      <button class="ks-ac" data-is="entry-open" data-id="${esc(e.id)}">${esc(e.title)}
        <small class="soluk">${esc(dayLabel(e.entryDate))} · ${esc(categoryName(e.category))}${e.counterparty ? " · " + esc(e.counterparty) : ""}${e.currency && e.currency !== "TRY" ? ` · ${esc(e.currency)} ${esc(e.originalAmount ?? "")}` : ""}${e.vatRate ? ` · ${esc(t("VAT {rate}%", { rate: e.vatRate }))}` : ""}${e.invoiceNo ? ` · ${esc(e.invoiceNo)}` : ""}${e.paidBy ? ` · ${esc(t("paid by {name}", { name: e.paidBy }))}` : ""}${e.items?.length ? ` · ${esc(t("{n} lines", { n: e.items.length }))}` : ""}</small></button>
      ${e.status === "pending" ? `<span style="display:flex;align-items:center;gap:6px"><span class="pil bugun" style="margin:0">${esc(t("Unpaid"))}</span><button class="ks-kucuk" data-is="mark-paid" data-id="${esc(e.id)}">${esc(t("Mark as paid"))}</button></span>` : "<span></span>"}
      <span class="ks-tutar ${e.direction === "in" ? "ks-gelir" : ""}">${e.direction === "in" ? "+" : "−"}${tl(e.amount)}</span>
    </div>`;

const findEntry = (id) => [...data.entries, ...data.pending].find((e) => e.id === id);

const ACTIONS = {
  "tax-settings"() { state.taxForm = true; render(); },
  "tax-cancel"() { state.taxForm = false; render(); },
  "year-end"(b) { state.yearEnd = !!b.dataset.on; return load(); },
  async "file-remove"(b) {
    const e = state.form?.record;
    if (!e || !confirm(t("Remove this file?"))) return;
    try {
      const r = await fetch("./api/belge/sil", { method: "POST", headers: { "Content-Type": "application/json", "x-panel": "1" }, body: JSON.stringify({ entry: e.id, id: b.dataset.id }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      await reopenEntry(e.id);
    } catch (err) { notify(err.message); }
  },
  async "file-open-remote"(b) {
    const e = state.form?.record, tab = window.open("about:blank", "_blank");
    try { const { url } = await speysPost("belge", { entryId: e.id, key: b.dataset.key }); tab.location.href = url; }
    catch (err) { tab?.close(); notify(err.message); }
  },
  async "item-done"(b) {
    const e = state.form?.record;
    if (!e) return;
    try {
      const r = await fetch("./api/kalem/bitti", { method: "POST", headers: { "Content-Type": "application/json", "x-panel": "1" }, body: JSON.stringify({ entry: e.id, id: b.dataset.id, done: !!b.dataset.done }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      await reopenEntry(e.id);
    } catch (err) { notify(err.message); }
  },
  async "file-remove-remote"(b) {
    const e = state.form?.record;
    if (!e || !confirm(t("Remove this file from Speys?"))) return;
    try { await speysPost("belge/sil", { entryId: e.id, key: b.dataset.key }); await reopenEntry(e.id); } catch (err) { notify(err.message); }
  },
  async "speys-connect"() {
    // The tab is opened right on the click (a tab opened after waiting is blocked), then sent to Speys.
    const tab = window.open("about:blank", "_blank");
    try {
      const { url } = await speysPost("connect");
      if (tab) tab.location.href = url; else location.href = url;
    } catch (e) { tab?.close(); notify(e.message); }
  },
  async "speys-business"() {
    const select = $("#speys-business"), b = businesses?.find((x) => x.id === select?.value);
    if (!b || !confirm(t("The ledger on this computer and \"{name}\" in Speys become one: entries from both sides are kept in both places. Continue?", { name: b.name }))) return;
    syncing = true; render();
    try { speys = await speysPost("business", { id: b.id, name: b.name }); await load(); }
    catch (e) { notify(e.message); }
    finally { syncing = false; render(); }
  },
  "speys-sync"() { return syncNow(true); },
  async "speys-disconnect"() {
    if (!confirm(t("Disconnect from Speys? The ledger stays on this computer; to remove access fully, also remove it in Speys → Settings → Connections."))) return;
    try { speys = await speysPost("disconnect"); businesses = null; render(); } catch (e) { notify(e.message); }
  },
  async "dup-drop"(b) {
    const e = [...data.entries, ...data.pending, ...(speys?.duplicates ?? []).flatMap((d) => [d.a, d.b])].find((x) => x.id === b.dataset.id);
    if (!e || !confirm(t('Delete "{title}"?', { title: e.title }))) return;
    try { speys = await speysPost("duplicate", { drop: e.id }); await load(); syncNow(); } catch (err) { notify(err.message); }
  },
  async "dup-keep"(b) {
    try { speys = await speysPost("duplicate", { key: b.dataset.key }); render(); } catch (err) { notify(err.message); }
  },
  tab(b) { state.form = null; goTo("kasa", b.dataset.tab); },
  "month-step"(b) {
    const d = new Date(state.year, state.month + +b.dataset.step, 1);
    state.year = d.getFullYear(); state.month = d.getMonth(); state.category = ""; state.form = null;
    return load();
  },
  "month-pick"(b) {
    state.year = +b.dataset.ym.slice(0, 4); state.month = +b.dataset.ym.slice(5, 7) - 1; state.category = ""; state.form = null;
    if (activeTab() !== "monthly") goTo("kasa", "sirket");
    return load();
  },
  "plan-add"() { state.direction = "out"; state.form = { kind: "plan", record: null, scenarioId: null }; render(); },
  "scenario-pick"(b) { state.scenario = b.dataset.id; state.form = null; return load(); },
  "scenario-add"() { state.form = { kind: "scenario", record: null }; render(); },
  "scenario-open"(b) { const x = data.scenarios.find((s) => s.id === b.dataset.id); if (x) { state.form = { kind: "scenario", record: x }; render(); } },
  "scenario-delete"() {
    const x = state.form.record;
    if (confirm(t('Delete the scenario "{name}" and the plan items only in it?', { name: x.name }))) { state.scenario = null; return write("senaryo/sil", { id: x.id }, t("Deleted")); }
  },
  "plan-open"(b) { const p = data.plans.find((x) => x.id === b.dataset.id); if (p) { state.form = { kind: "plan", record: p }; render(); } },
  "plan-delete"() {
    const p = state.form.record;
    if (confirm(t('Delete "{title}" from the plan?', { title: p.title }))) return write("plan/sil", { id: p.id }, t("Deleted"));
  },
  category(b) { state.category = state.category === b.dataset.category ? "" : b.dataset.category; render(); },
  "entry-add"() { state.direction = "out"; state.form = { kind: "entry", record: null }; render(); },
  "entry-open"(b) { const e = findEntry(b.dataset.id); if (e) { state.form = { kind: "entry", record: e }; render(); $("#entry-form").scrollIntoView({ block: "center" }); } },
  "rule-add"() { state.direction = "out"; state.form = { kind: "rule", record: null }; render(); },
  "rule-open"(b) { const r = data.rules.find((x) => x.id === b.dataset.id); if (r) { state.form = { kind: "rule", record: r }; render(); } },
  cancel() { state.form = null; render(); },
  direction(b) { state.direction = b.dataset.direction; render(); },
  "entry-delete"() {
    const e = state.form.record;
    if (confirm(t('Delete "{title}"?', { title: e.title }))) return write("kayit/sil", { id: e.id }, t("Deleted"));
  },
  "rule-delete"() {
    const r = state.form.record;
    if (confirm(t('Delete "{title}"? Entries already written to the ledger stay.', { title: r.title }))) return write("kural/sil", { id: r.id }, t("Deleted"));
  },
  "mark-paid"(b) { const e = findEntry(b.dataset.id); if (e) return write("kayit", { ...e, status: "paid" }, t("Paid")); },
  "rule-toggle"(b) {
    const r = data.rules.find((x) => x.id === b.dataset.id);
    if (r) return write("kural/durum", { id: r.id, active: !r.isActive }, r.isActive ? t("Paused") : t("Resumed"));
  },
};

/** After a file change: reload and keep the same entry open. */
async function reopenEntry(id) {
  await load();
  const e = findEntry(id);
  state.form = e ? { kind: "entry", record: e } : null;
  render();
}
document.addEventListener("change", async (ev) => {
  if (ev.target.id !== "file-add" || !ev.target.files?.[0]) return;
  const f = ev.target.files[0], e = state.form?.record;
  if (!e) return;
  if (f.size > 10 * 1024 * 1024) return notify(t("The file is larger than 10 MB"));
  try {
    const r = await fetch(`./api/belge?${new URLSearchParams({ entry: e.id, name: f.name })}`, { method: "POST", headers: { "Content-Type": f.type || "application/octet-stream", "x-panel": "1" }, body: f });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.status);
    notify(t("Added"));
    await reopenEntry(e.id);
    syncNow();
  } catch (err) { notify(err.message); }
});
window.addEventListener("hashchange", () => { state.form = null; render(); });
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-is]");
  if (b) ACTIONS[b.dataset.is]?.(b);
});
document.addEventListener("change", (ev) => {
  if (ev.target.id !== "rule-cycle" && ev.target.id !== "plan-cycle") return;
  // Keep what was typed: the fields depend on the cycle, so re-render and put the values back.
  const formId = ev.target.form.id, values = Object.fromEntries(new FormData(ev.target.form));
  state.form.cycle = ev.target.value;
  render();
  const fresh = $(`#${formId}`);
  for (const [k, v] of Object.entries(values)) if (fresh.elements[k] && k !== "cycle" && k !== "pending") fresh.elements[k].value = v;
  if (fresh.elements.pending) fresh.elements.pending.checked = !!values.pending;
});
// A foreign-currency document: the amount in the ledger's currency is the original × the rate, filled in as it's typed.
document.addEventListener("input", (ev) => {
  if (!ev.target.hasAttribute("data-is-fx")) return;
  const form = ev.target.form, original = +form.elements.originalAmount?.value, rate = +form.elements.fxRate?.value;
  if (form.elements.currency?.value && original > 0 && rate > 0) form.elements.amount.value = Math.round(original * rate * 100) / 100;
});
document.addEventListener("submit", (ev) => {
  if (ev.target.id === "tax-form") {
    ev.preventDefault();
    const f = new FormData(ev.target);
    state.taxForm = false;
    write("vergi/ayar", { activity: f.get("activity"), bagkur: f.get("bagkur"), youngEntrepreneur: !!f.get("youngEntrepreneur") }, t("Saved"));
    return;
  }
  if (ev.target.id === "accountant-form") {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const items = f.getAll("pick").map((key) => ({ key, amount: +f.get(`amount-${key}`) }));
    if (!items.length) return notify(t("Choose at least one"));
    write("musavir", { items, startDate: f.get("startDate") }, t("Added"));
    return;
  }
  if (ev.target.matches(".ks-cakisma")) {
    ev.preventDefault();
    const form = ev.target, picks = Object.fromEntries(new FormData(form));
    speysPost("resolve", { key: form.dataset.key, id: form.dataset.conflict, picks })
      .then(async (d) => { speys = d; notify(t("Saved")); await load(); })
      .catch((e) => notify(e.message));
    return;
  }
  const f = new FormData(ev.target), current = state.form?.record;
  if (ev.target.id === "entry-form") {
    ev.preventDefault();
    write("kayit", {
      id: current?.id, direction: current?.direction ?? state.direction, note: current?.note,
      title: f.get("title"), amount: +f.get("amount"), category: f.get("category"), entryDate: f.get("entryDate"),
      counterparty: f.get("counterparty"), status: f.get("pending") ? "pending" : "paid", ...moreValues(f),
    }, t("Saved"));
  } else if (ev.target.id === "plan-form") {
    ev.preventDefault();
    write("plan", {
      id: current?.id, direction: current?.direction ?? state.direction, note: current?.note,
      title: f.get("title"), amount: +f.get("amount"), category: f.get("category"), cycle: f.get("cycle"),
      startMonth: f.get("startMonth"), endMonth: f.get("endMonth") || null,
      vatRate: f.get("vatRate") === "" ? null : +f.get("vatRate"), vatIncluded: !!f.get("vatIncluded"),
      withholdingRate: f.get("withholdingRate") ? +f.get("withholdingRate") : null,
      ...(f.has("annualIncreasePct") ? { annualIncreasePct: f.get("annualIncreasePct") === "" ? null : +f.get("annualIncreasePct") } : {}),
      ...(f.has("scenarioId") ? { scenarioId: f.get("scenarioId") || null } : {}),
    }, t("Saved"));
  } else if (ev.target.id === "scenario-form") {
    ev.preventDefault();
    write("senaryo", {
      id: current?.id, name: f.get("name"), note: current?.note,
      openingBalance: f.get("openingBalance") === "" ? null : +f.get("openingBalance"), isDefault: !!f.get("isDefault"),
    }, t("Saved"));
  } else if (ev.target.id === "rule-form") {
    ev.preventDefault();
    write("kural", {
      id: current?.id, direction: current?.direction ?? state.direction, isActive: current?.isActive ?? true,
      title: f.get("title"), amount: +f.get("amount"), category: f.get("category"), cycle: f.get("cycle"),
      dayOfMonth: +f.get("dayOfMonth"), monthOfYear: f.get("monthOfYear") ? +f.get("monthOfYear") : null,
      counterparty: current?.counterparty, autoPaid: !f.get("pending"), ...moreValues(f),
    }, t("Saved"));
  }
});

// The sign-in tab says when it's done.
window.addEventListener("message", (ev) => {
  if (ev.origin !== location.origin || !ev.data || typeof ev.data.speys !== "boolean") return;
  businesses = null;
  loadSpeys();
});
// Sync while the page is open: on opening, every five minutes, and when the tab comes back. Never in the background.
const SYNC_EVERY = 5 * 60 * 1000;
setInterval(() => { if (!document.hidden) syncNow(); }, SYNC_EVERY);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadSpeys().then(() => syncNow()); });

render();
load();
loadSpeys().then(() => syncNow());
</script>
</body>
</html>
