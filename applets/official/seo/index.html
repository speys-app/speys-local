<main id="icerik"></main>

<script>
"use strict";

let editing = false;
const route = () => {
  const [, sub = "", ...file] = decodeURIComponent(location.hash.slice(1)).split("/");
  return { tab: "seo", sub, file: file.join("/") };
};
window.addEventListener("hashchange", render);
function render() {
  const scroll = scrollY;
  $("#icerik").innerHTML = seoData?.not_configured ? notConfigured("SEO") : renderSeo();
  scrollTo(0, scroll);
}
document.documentElement.style.setProperty("--ust", "0px");

const clicksText = (n) => (n === 1 ? t("{n} click", { n }) : t("{n} clicks", { n }));
const impressionsText = (n) => (n === 1 ? t("{n} impression", { n }) : t("{n} impressions", { n }));
const positionText = (n) => t("position {n}", { n });
const daysAgoText = (n) => (n === 1 ? t("{n} day ago", { n }) : t("{n} days ago", { n }));
const errorsText = (n) => (n === 1 ? t("{n} error", { n }) : t("{n} errors", { n }));

const splitTags = (text) => {
  const m = text.match(/((?:\s+#[\p{L}\p{N}_-]+)+)\s*$/u);
  if (!m || m.index === 0) return { body: text, tags: [] };
  return { body: text.slice(0, m.index).trimEnd(), tags: m[1].trim().split(/\s+/).map((x) => x.slice(1)) };
};

function parseList(content) {
  let title = null; const blocks = []; const stack = [];
  content.split("\n").forEach((raw, line) => {
    if (!raw.trim()) return;
    if (raw.startsWith("# ")) { title = raw.slice(2).trim(); return; }
    if (raw.startsWith("## ")) { blocks.push({ type: "section", text: raw.slice(3).trim() }); stack.length = 0; return; }
    if (/^#{3,6} /.test(raw)) { blocks.push({ type: "subsection", text: raw.replace(/^#+\s*/, "") }); stack.length = 0; return; }
    if (raw.trim() === "---") { blocks.push({ type: "divider" }); stack.length = 0; return; }
    const depth = Math.floor((raw.match(/^\s*/)[0].length) / 2);
    while (stack.length && stack.at(-1).depth >= depth) stack.pop();
    const siblings = stack.length ? stack.at(-1).node.children : blocks;
    const m = raw.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/);
    if (m) {
      const { body, tags: all } = splitTags(m[2]);
      const finished = all.map((tag) => tag.match(/^bitti-(\d{4}-\d{2}-\d{2})$/)?.[1]).find(Boolean) || null;
      const tags = all.filter((tag) => !/^bitti-\d{4}-\d{2}-\d{2}$/.test(tag));
      const node = { type: "task", line, raw, body, tags, finished, done: m[1] !== " ", children: [] };
      siblings.push(node);
      stack.push({ depth, node });
    } else siblings.push({ type: "note", text: raw.trim().replace(/^[-*] /, "") });
  });
  return { title, blocks };
}
// —— SEO ——————————————————————————————————————————————————
// One screen per site; a card shows the data it has. The site's file + live status. The daily task is ticked (one task since
// history is the last 3 days as dots; an opportunity's status cycles on click; a weekly check has "Done today".
let seoData = null, seoRequested = false, openPost = null;
// How a page looks in search: opening a row calls /api/seo/onizleme; url → data | "loading"
let openPage = null, previews = {};
const SEO_STATES = [["sirada", t("Up next")], ["yapiliyor", t("In progress")], ["fikir", t("Idea")], ["bitti", t("Done")]];
async function loadSeo(refresh) {
  const q = new URLSearchParams();
  if (route().sub) q.set("site", route().sub);
  if (refresh) q.set("yenile", "1");
  seoData = await getJson(`./api/seo?${q}`);
}
async function writeSeo(body) {
  const r = await fetch("./api/seo", { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" }, body: JSON.stringify({ ...body, site: seoData.site, surum: seoData.surum }) });
  if (r.status === 409) notify(t("The SEO file changed in the meantime; reloaded."));
  else if (!r.ok) notify(t("Could not save."));
  await loadSeo(); render();
}
// Search Console (lib/search-console.js, every 6 hours; includes the last days that are not final yet, dashed in the chart).
// The sitemap's "indexed" count is gone from the API; submitted pages and Google's last read are shown instead.
// Its own card at the top of the page: four metrics at the same size, each with last 7 / previous 7 days, daily chart below.
/** A slice of the daily series: total clicks / impressions, impression-weighted position, click-through rate. */
function scSlice(rows) {
  const clicks = rows.reduce((a, r) => a + r.tiklama, 0), impressions = rows.reduce((a, r) => a + r.gosterim, 0);
  return { tiklama: clicks, gosterim: impressions, sira: impressions ? rows.reduce((a, r) => a + r.sira * r.gosterim, 0) / impressions : null, oran: impressions ? (100 * clicks) / impressions : null };
}
/** Like Search Console: clicks on their own axis on the left, impressions on their own axis on the
    right; both axes share the same four grid lines. Hovering a day shows a vertical line + two dots + a tooltip.
    `incomplete` (the first day that is not final) and after are dashed, as in Search Console. */
function scChart(rows, dayName, incomplete = null, W = 1100, H = 220) {
  if (rows.length < 2) return `<p class="bos">${esc(t("A chart needs at least two days."))}</p>`;
  const left = 30, right = 40, top = 26, bottom = 24;
  const ceiling = (m) => 4 * ([1, 2, 5, 10, 20, 25, 50, 100, 250, 500, 1000].find((a) => m / a <= 4) || Math.ceil(m / 4));
  const maxClicks = ceiling(Math.max(1, ...rows.map((r) => r.tiklama))), maxImpressions = ceiling(Math.max(1, ...rows.map((r) => r.gosterim)));
  const px = (i) => left + (i * (W - left - right)) / (rows.length - 1), py = (v, m) => top + ((m - v) * (H - top - bottom)) / m;
  const grid = [0, 1, 2, 3, 4].map((k) => `<line x1="${left}" x2="${W - right}" y1="${py(k, 4)}" y2="${py(k, 4)}" class="cg-izgara"/>
    <text x="${left - 6}" y="${py(k, 4) + 4}" text-anchor="end" class="cg-eksen">${formatNumber((maxClicks * k) / 4)}</text>
    <text x="${W - right + 6}" y="${py(k, 4) + 4}" class="cg-eksen">${formatNumber((maxImpressions * k) / 4)}</text>`).join("");
  const cut = incomplete ? rows.findIndex((r) => r.gun >= incomplete) : -1;
  const points = (list, field, m, first) => list.map((r, i) => `${px(first + i)},${py(r[field], m)}`).join(" ");
  const line = (field, m, cls) => cut < 0 ? `<polyline class="${cls}" points="${points(rows, field, m, 0)}"/>`
    : (cut > 0 ? `<polyline class="${cls}" points="${points(rows.slice(0, cut), field, m, 0)}"/>` : "")
      + `<polyline class="${cls} eksik" points="${points(rows.slice(Math.max(0, cut - 1)), field, m, Math.max(0, cut - 1))}"/>`;
  const step = Math.ceil(rows.length / 7), half = (W - left - right) / (rows.length - 1) / 2;
  const xLabels = rows.map((r, i) => (rows.length - 1 - i) % step ? "" : `<text x="${px(i)}" y="${H - 4}" text-anchor="${i === rows.length - 1 ? "end" : "middle"}" class="cg-eksen">${esc(shortDay(r.gun))}</text>`).join("");
  const days = rows.map((r, i) => `<g class="scg-gun"><rect x="${px(i) - half}" y="${top}" width="${2 * half}" height="${H - top - bottom}"/>
    <line x1="${px(i)}" x2="${px(i)}" y1="${top}" y2="${H - bottom}"/>
    <circle cx="${px(i)}" cy="${py(r.tiklama, maxClicks)}" r="4.5" fill="var(--sc-tik)"/><circle cx="${px(i)}" cy="${py(r.gosterim, maxImpressions)}" r="4.5" fill="var(--sc-gos)"/>
    <title>${esc(dayName(r.gun))}${cut >= 0 && i >= cut ? ` · ${esc(t("not final yet"))}` : ""}\n${esc(clicksText(r.tiklama))} · ${esc(impressionsText(r.gosterim))}${r.gosterim ? ` · ${esc(positionText(formatDecimal(r.sira)))}` : ""}</title></g>`).join("");
  return `<svg class="scg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("Daily clicks and impressions"))}">
    <text x="0" y="12" class="cg-eksen">${esc(t("Clicks"))}</text><text x="${W}" y="12" text-anchor="end" class="cg-eksen">${esc(t("Impressions"))}</text>
    ${grid}${line("gosterim", maxImpressions, "g")}${line("tiklama", maxClicks, "t")}${xLabels}${days}</svg>`;
}
function scCard(sc, summary, dayName) {
  const totals = summary?.toplam;
  if (!sc.bagli) return `<section class="kart sc-kart"><h2>Search Console</h2><p class="bos">${esc(t("Not connected: node lib/search-console.js giris"))}</p></section>`;
  if (!totals) return `<section class="kart sc-kart"><h2>Search Console</h2><p class="bos">${esc(sc.hata || t("property not found"))}</p></section>`;
  const rows = summary.gunluk || [], last = scSlice(rows.slice(-7)), previous = scSlice(rows.slice(-14, -7));
  const whole = (v) => formatNumber(Math.round(v)), pct = (v) => t("{n}%", { n: formatDecimal(v) });
  const metric = (label, value, field, fmt, good) => {
    const a = last[field], b = previous[field], delta = a == null || b == null ? null : a - b;
    const diff = delta == null || Math.abs(delta) < 0.05 ? `<span class="soluk">${esc(t("same"))}</span>`
      : `<span class="${(good === "low" ? delta < 0 : delta > 0) ? "fark-iyi" : "fark-kotu"}">${delta > 0 ? "+" : "−"}${fmt(Math.abs(delta))}</span>`;
    return `<div><span>${label}</span><b>${value}</b>
      <small>${t("last 7 days {current} {diff} · previous 7 days {previous}", { current: a == null ? "—" : fmt(a), diff, previous: b == null ? "—" : fmt(b) })}</small></div>`;
  };
  const chart = scChart(rows, dayName, summary.eksik);
  return `<section class="kart sc-kart"><h2>${esc(t("Search Console · {start} – {end} (28 days)", { start: dayName(summary.bas), end: dayName(summary.bit) }))}</h2>
    <div class="sc-olcu">${metric(`<i class="renk" style="background:var(--sc-gos)"></i>${esc(t("Impressions"))}`, formatNumber(totals.gosterim), "gosterim", whole, "high")}${metric(`<i class="renk" style="background:var(--sc-tik)"></i>${esc(t("Clicks"))}`, formatNumber(totals.tiklama), "tiklama", whole, "high")}${metric(esc(t("Avg. position")), formatDecimal(totals.sira), "sira", (v) => formatDecimal(v), "low")}${metric(esc(t("CTR")), pct(totals.oran), "oran", pct, "high")}</div>
    ${chart}
    <p class="sc-alt">${esc(summary.site)} · ${esc(summary.eksik ? t("{day} and after not final yet (dashed)", { day: dayName(summary.eksik) }) : t("data ~2 days behind"))} · ${esc(t("fetched {time}, refreshes itself every 6 hours", { time: (sc.alindi || "").slice(11, 16) || "—" }))}
      <button type="button" data-is="seo-yenile">${esc(t("Refresh"))}</button>${sc.hata ? ` · <span class="fark-kotu">${esc(sc.hata)}</span>` : ""}</p></section>`;
}
function sitemapBox(v, summary, domain, dayName) {
  const sm = v.sitemap || {}, maps = summary?.sitemaps || [];
  const lastRead = maps.map((x) => x.son_okuma).filter(Boolean).sort().at(-1), errors = maps.reduce((a, x) => a + x.hata, 0);
  const lines = [(sm.bolumler || []).slice(0, 5).map(([b, n]) => `${esc(b)} ${n}`).join(" · ") || esc(sm.error || ""),
    lastRead ? esc(t("Google last read: {day}", { day: dayName(lastRead.slice(0, 10)) })) : "", errors ? esc(errorsText(errors)) : ""].filter(Boolean);
  return `<div><b>${sm.toplam ?? (maps.reduce((a, x) => a + x.sayfa, 0) || "—")}</b><span>${esc(t("pages in sitemap · {domain}", { domain }))}</span>${lines.map((s) => `<small>${s}</small>`).join("")}</div>`;
}
function scList(rows, field, count = 12) {
  return (rows || []).slice(0, count).map((q) => {
    const name = field === "sayfa" ? q.sayfa.replace(/^https?:\/\/(www\.)?[^/]+/, "") || "/" : q.sorgu;
    return `<li><b>${esc(name)}</b> <small>${esc(impressionsText(q.gosterim))} · ${esc(clicksText(q.tiklama))} · ${esc(positionText(q.sira))}</small></li>`;
  }).join("");
}
/** Page list; opening a row shows the search result preview + structured data checks below it (previewHtml). */
function scPages(rows, count = 12) {
  return (rows || []).slice(0, count).map((q) => {
    const u = new URL(q.sayfa), main = (seoData?.siteler || []).some((x) => u.host === x.alan || u.host === `www.${x.alan}`);
    const name = (main ? "" : u.host.split(".")[0] + " · ") + decodeURIComponent(u.pathname + u.search);
    const open = openPage === q.sayfa;
    const n = q.tiklama, position = formatDecimal(q.sira);
    return `<li class="seo-sayfa${open ? " acik" : ""}"><div class="bas" data-seo-sayfa="${esc(q.sayfa)}"><b>${esc(name)}</b>
      <small>${esc(impressionsText(q.gosterim))} · ${esc(n === 1 ? t("{n} click · position {position}", { n, position }) : t("{n} clicks · position {position}", { n, position }))}</small></div>${open ? previewHtml(q.sayfa) : ""}</li>`;
  }).join("");
}
// Helper types not counted in the preview (address, offer, list item…): only the main blocks stay
const JSONLD_HELPER_TYPES = new Set(["PostalAddress", "GeoCoordinates", "ListItem", "Offer", "MenuSection", "MenuItem", "Question", "Answer", "AggregateRating", "LocationFeatureSpecification", "ImageObject", "Person", "SearchAction", "EntryPoint"]);
function previewHtml(url) {
  const v = previews[url];
  if (!v || v === "loading") return `<p class="bos serp-bekle">${esc(t("Checking the page, Google and schema.org…"))}</p>`;
  if (v.error && !v.sayfa) return `<p class="fark-kotu">${esc(v.error)}</p>`;
  const s = v.sayfa || {}, g = v.google || {}, sc = v.schema || {}, u = new URL(url);
  const dayMonth = (iso) => new Date(iso).toLocaleDateString(LOCALE, { day: "numeric", month: "long" });
  const path = u.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  // Google shows the rating line only when it accepts the review snippet. z.tur comes from Google in the request's language.
  const reviewValid = (g.zengin || []).some((z) => /yorum|review/i.test(z.tur) && !z.sorunlar.length);
  const reviewCount = s.puan ? s.puan.reviewCount ?? s.puan.ratingCount ?? "?" : "?";
  const ratingText = () => {
    const values = { value: formatDecimal(s.puan.ratingValue), count: reviewCount };
    return Number(reviewCount) === 1 ? t("Rating: {value} · {count} review", values) : t("Rating: {value} · {count} reviews", values);
  };
  const rating = s.puan && reviewValid ? `<div class="serp-puan">${esc(ratingText())}${s.fiyat ? ` · ${esc(s.fiyat)}` : ""}</div>` : "";
  const warnings = [];
  if (s.error) warnings.push(t("Could not read the page: {error}", { error: s.error }));
  if (s.kod && s.kod !== 200) warnings.push(`HTTP ${s.kod}${s.son_url !== url ? ` → ${s.son_url}` : ""}`);
  if (/noindex/i.test(s.robots || "")) warnings.push(t("robots: {robots} (will not show in search)", { robots: s.robots }));
  if (s.canonical && s.canonical.replace(/\/$/, "") !== url.replace(/\/$/, "")) warnings.push(`${t("canonical is another page: {url}", { url: s.canonical })}${s.canonical_kaynak === "http" ? ` ${t("(via HTTP header)")}` : ""}`);
  if (g.google_canonical && g.google_canonical.replace(/\/$/, "") !== url.replace(/\/$/, "")) warnings.push(t("Canonical page chosen by Google: {url}", { url: g.google_canonical }));
  if (!s.error && !s.aciklama) warnings.push(t("No description: Google picks one from the page itself."));
  const types = s.turler || {};
  const blocks = Object.keys(types).filter((k) => !JSONLD_HELPER_TYPES.has(k)).map((k) => {
    if (k === "Menu" && types.MenuItem) {
      const n = types.MenuItem;
      return n === 1 ? t("Menu ({n} item)", { n }) : t("Menu ({n} items)", { n });
    }
    if (k === "FAQPage" && types.Question) {
      const n = types.Question;
      return n === 1 ? t("FAQPage ({n} question)", { n }) : t("FAQPage ({n} questions)", { n });
    }
    return types[k] > 1 ? `${k} ×${types[k]}` : k;
  });
  const issuesText = (n) => (n === 1 ? t("{n} issue", { n }) : t("{n} issues", { n }));
  const brokenText = (n) => (n === 1 ? t("{n} block could not be read", { n }) : t("{n} blocks could not be read", { n }));
  const googleLine = g.error ? `<span class="fark-kotu">${esc(g.error)}</span>`
    : `${esc(g.durum || "—")}${g.son_tarama ? ` · ${esc(t("last crawled {day}", { day: dayMonth(g.son_tarama) }))}` : ""}${(g.zengin || []).map((z) =>
      ` · <span class="${z.sorunlar.length ? "fark-kotu" : "fark-iyi"}" title="${esc(z.sorunlar.map((x) => x.mesaj).join("\n"))}">${esc(z.tur)} ${z.sorunlar.length ? esc(issuesText(z.sorunlar.length)) : "✓"}</span>`).join("")}
      ${(g.zengin || []).flatMap((z) => z.sorunlar).map((x) => `<br><small>${esc(x.seviye)}: ${esc(x.mesaj)}</small>`).join("")}`;
  const schemaLine = `${blocks.length ? esc(blocks.join(" · ")) : `<span class="soluk">${esc(t("no structured data"))}</span>`}${s.jsonld_bozuk ? ` · <span class="fark-kotu">${esc(brokenText(s.jsonld_bozuk))}</span>` : ""}
    · schema.org: ${sc.error ? `<span class="soluk">${esc(sc.error)}</span>` : (sc.hatalar || []).length ? `<span class="fark-kotu">${esc(errorsText(sc.hatalar.length))}</span>${sc.hatalar.slice(0, 8).map((h) => `<br><small>${esc(h.yer)}: ${esc(h.tur)} ${esc(JSON.stringify(h.ayrinti ?? ""))}</small>`).join("")}` : `<span class="fark-iyi">${esc(t("no errors"))}</span>`}`;
  return `<div class="serp">
      <div class="serp-site"><img src="https://${esc(u.host)}/favicon.ico" alt="" onerror="this.style.visibility='hidden'">
        <div><b>${esc(s.site_adi || u.host)}</b><span>${esc(u.origin)}${path.map((p) => ` › ${esc(p)}`).join("")}</span></div></div>
      <a class="serp-baslik" href="${esc(url)}" target="_blank" rel="noopener">${esc(s.baslik || url)}</a>
      ${rating}<p class="serp-aciklama">${esc(s.aciklama || "")}</p>
    </div>
    ${warnings.map((x) => `<p class="serp-uyari">${esc(x)}</p>`).join("")}
    <dl class="serp-denetim"><div><dt>Google</dt><dd>${googleLine}</dd></div><div><dt>${esc(t("Structured data"))}</dt><dd>${schemaLine}</dd></div></dl>
    <p class="serp-alt">${esc(t("The title and description we provide; Google sometimes rewrites them. Google's report only covers rich result types (breadcrumbs, reviews…); the format of the menu, restaurant, FAQ and company blocks comes from schema.org."))}
      · ${esc(t("fetched {time}", { time: (v.alindi || "").slice(11, 16) }))} <button type="button" data-is="seo-onizleme-yenile" data-url="${esc(url)}">${esc(t("Refresh"))}</button></p>`;
}
async function fetchPreview(url, refresh) {
  previews[url] = "loading"; render();
  try { previews[url] = await getJson(`./api/seo/onizleme?url=${encodeURIComponent(url)}${refresh ? "&yenile=1" : ""}`); }
  catch (err) { previews[url] = { error: String(err.message || err) }; }
  render();
}
document.addEventListener("click", (e) => {
  if (route().tab !== "seo") return;
  const b = e.target.closest('[data-is="seo-site"]');
  if (b) return goTo("seo", b.dataset.site === seoData?.siteler?.[0]?.id ? "" : b.dataset.site);
  const task = e.target.closest('[data-is="seo-sr-ac"]');
  if (task && !e.target.closest("a")) parent.openApplet?.("tasks", `gorevler/${task.dataset.proje}/${task.dataset.liste}`);
});
/** The same screen for every site: a card shows whatever data there is. */
function renderSeo() {
  const sites = seoData?.siteler || [], site = sites.find((x) => x.id === route().sub) || sites[0];
  const picker = sites.length > 1 ? `<div class="alt-sekmeler">${sites.map((x) =>
    `<button class="${x.id === site.id ? "secili" : ""}" data-is="seo-site" data-site="${esc(x.id)}"><img src="/a/tasks/ikon/${esc(x.proje || x.id)}" alt="">${esc(x.ad)}</button>`).join("")}</div>` : "";
  if (!seoData || seoData.site !== site.id) {
    if (!seoRequested) {
      seoRequested = true;
      loadSeo().then(() => { seoRequested = false; render(); }, () => { seoRequested = false; notify(t("Could not load.")); });
    }
    return picker + `<p class="bos">${esc(t("Loading…"))}</p>`;
  }
  const v = seoData, today = v.bugun, doneToday = new Set(v.kayit[today] || []);
  const dayName = (iso) => new Date(iso + "T00:00").toLocaleDateString(LOCALE, { day: "numeric", month: "long" });
  const daysSince = (iso) => Math.round((new Date(today + "T00:00") - new Date(iso + "T00:00")) / 864e5);
  // The day strip shows the last 3 days; the file keeps the full record.
  const last3 = [...Array(3)].map((_, i) => { const d = new Date(today + "T00:00"); d.setDate(d.getDate() - 2 + i); return isoDay(d); });
  const sc = v.search_console || {}, summary = sc.ozetler?.[site.alan];
  const passingPosts = v.yazilar.filter((y) => y.puan === y.toplam).length;
  const lastCheck = v.kontroller.map((k) => k.son).filter(Boolean).sort().at(-1) || null;
  const tasks = [];
  const walk = (nodes) => nodes.forEach((d) => { if (d.type === "task") { tasks.push(d); walk(d.children); } });
  if (v.liste) walk(parseList(v.liste).blocks);
  const openTasks = tasks.filter((d) => !d.done);
  const doneOpportunities = v.firsatlar.filter((f) => f.durum === "bitti").length;
  const allWork = tasks.length + v.firsatlar.length, doneWork = tasks.length - openTasks.length + doneOpportunities, openWork = allWork - doneWork;
  const top = `${scCard(sc, summary, dayName)}<div class="seo-ust">${sitemapBox(v, summary, site.alan, dayName)}
    <div><b>${doneWork}/${allWork}</b><span>${esc(t("SEO tasks done"))}</span><small>${esc(openWork === 1 ? t("{n} open task", { n: openWork }) : t("{n} open tasks", { n: openWork }))}${v.liste_ad ? ` · ${esc(v.liste_ad)}` : ""}</small></div>
    <div><b>${v.yazilar.length ? `${passingPosts}/${v.yazilar.length}` : "—"}</b><span>${esc(t("blog posts pass every check"))}</span><small>${esc(v.yazilar.length ? t("weakest: {title}", { title: v.yazilar[0].baslik }) : t("blog folder not set"))}</small></div>
    <div><b>${lastCheck ? esc(dayName(lastCheck)) : "—"}</b><span>${esc(t("last SEO check"))}${lastCheck ? ` · ${esc(daysAgoText(daysSince(lastCheck)))}` : ""}</span><small>${esc(v.son_rapor?.dosya || t("no report yet"))}</small></div>
  </div>`;
  const daily = v.gunluk.map((g) => `<div class="seo-is" data-seo-is="${esc(g.id)}">${checkboxHtml(doneToday.has(g.id), "md").replace('data-is="isaretle"', 'data-is="seo-gunluk"')}
      <div class="govde"><b>${esc(g.ad)}</b><p>${esc(g.nasil)}</p>
        <div class="seo-gecmis" title="${esc(t("Last 3 days"))}">${last3.map((d) => `<i class="${(v.kayit[d] || []).includes(g.id) ? "on" : ""}" title="${esc(dayName(d))}"></i>`).join("")}</div></div></div>`).join("");
  const analysisDay = Object.keys(v.analiz || {}).sort().at(-1), analysis = analysisDay && v.analiz[analysisDay];
  const analysisList = (label, items) => items?.length ? `<b>${esc(label)}</b><ul>${items.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : "";
  const analysisHtml = analysis ? `<div class="seo-analiz"><h3>${esc(analysisDay === today ? t("Today's analysis") : t("Latest analysis · {day}", { day: dayName(analysisDay) }))}</h3>
      ${analysisList(t("Status"), analysis.durum)}${analysisList(t("What was done"), analysis.yapilanlar)}</div>` : "";
  const openHtml = openTasks.map((d) => `<li class="seo-sr-is" data-is="seo-sr-ac" data-proje="${esc(site.proje || "")}" data-liste="${esc(v.liste_ad?.split("/").at(-1) || "")}">${inlineMd(d.body)}</li>`).join("");
  const posts = v.yazilar.map((y) => {
    const open = openPost === y.slug, missing = y.kontrol.filter((k) => !k.tamam);
    const color = y.puan === y.toplam ? "var(--yesil)" : y.puan >= y.toplam - 2 ? "var(--turuncu)" : "var(--kirmizi)";
    return `<div class="seo-yazi" data-seo-yazi="${esc(y.slug)}"><div class="ust"><b>${esc(y.baslik)}</b>
        <span class="seo-noktalar">${y.kontrol.map((k) => `<i class="${k.tamam ? "on" : ""}" title="${esc(k.ad)}"></i>`).join("")}</span>
        <span class="puan" style="color:${color}">${y.puan}/${y.toplam}</span></div>
      <span class="pil-a">${y.anahtar ? `“${esc(y.anahtar)}”` : esc(t("no keyword"))}</span>
      ${open ? `<ul>${missing.map((k) => `<li>${esc(k.ad)}</li>`).join("") || `<li>${esc(t("All good."))}</li>`}</ul><a href="https://${esc(site.alan)}/blog/${esc(y.slug)}" target="_blank" rel="noopener" style="font-size:12px">${esc(t("Open post ↗"))}</a>` : ""}</div>`;
  }).join("");
  const opportunities = SEO_STATES.flatMap(([d]) => v.firsatlar.filter((f) => f.durum === d)).map((f) => {
    const label = SEO_STATES.find(([d]) => d === f.durum)?.[1] || f.durum;
    return `<div class="seo-firsat ${esc(f.durum)}"><div class="ust"><b>${esc(f.baslik)}</b>
      <button type="button" class="seo-durum ${esc(f.durum)}" data-is="seo-firsat" data-id="${esc(f.id)}" title="${esc(t("Change status"))}">${esc(label)}</button></div>
      ${f.neden ? `<p>${esc(f.neden)}</p>` : ""}</div>`;
  }).join("");
  const checks = v.kontroller.map((k) => {
    const days = k.son ? daysSince(k.son) : null;
    return `<div class="seo-kontrol"><span class="no">${esc(k.no)}</span><div class="ad">${esc(k.ad)}
      <small class="${days === null || days > 7 ? "gec" : ""}">${k.son ? `${esc(dayName(k.son))} · ${esc(days === 0 ? t("today") : daysAgoText(days))}` : esc(t("never done"))}</small></div>
      ${k.son === today ? `<button type="button" data-is="seo-kontrol" data-no="${esc(k.no)}" data-geri="1">${esc(t("Undo"))}</button>` : `<button type="button" data-is="seo-kontrol" data-no="${esc(k.no)}">${esc(t("Done today"))}</button>`}</div>`;
  }).join("");
  const queries = scList(summary?.sorgular, "sorgu");
  // Every site has the same cards in the same order; a card without data shows its empty text.
  return `${picker}<div class="seo">${top}<div class="izgara"><div class="sutun">
      <section class="kart"><h2>${esc(t("Today · {done}/{total}", { done: doneToday.size, total: v.gunluk.length }))}</h2>${daily || `<p class="bos">${esc(t("Nothing to do today."))}</p>`}${analysisHtml}</section>
      <section class="kart"><h2>${esc(t("To do"))}</h2>
        ${openHtml ? `<ul class="liste">${openHtml}</ul><p class="soluk" style="font-size:12px;margin:6px 0 10px">${esc(t("{list} · opens in Tasks when clicked.", { list: v.liste_ad }))}</p>` : ""}
        ${opportunities || (openHtml ? "" : `<p class="bos">${esc(t("No tasks yet."))}</p>`)}
        <div class="seo-ekle"><input id="seo-yeni" placeholder="${esc(t("New task: title"))}"><button type="button" data-is="seo-ekle">${esc(t("Add"))}</button></div></section>
      <section class="kart"><h2>${esc(t("Blog posts · SEO checks"))}</h2>${posts || `<p class="bos">${esc(t("Blog folder not set."))}</p>`}</section>
    </div><div class="sutun">
      <section class="kart"><h2>${esc(t("Search queries · by impressions"))}</h2><ul class="liste">${queries || `<li class="bos">${esc(t("No data."))}</li>`}</ul></section>
      <section class="kart"><h2>${esc(t("Pages · by impressions · how they look in search"))}</h2><ul class="liste">${scPages(summary?.sayfalar, 15) || `<li class="bos">${esc(t("No data."))}</li>`}</ul></section>
      <section class="kart"><h2>${esc(t("Weekly checks"))}</h2>${checks || `<p class="bos">${esc(t("No checks."))}</p>`}</section>
    </div></div></div>`;
}
document.addEventListener("click", async (e) => {
  if (route().tab !== "seo" || !seoData) return;
  const el = e.target.closest("[data-is]"), action = el?.dataset.is;
  if (action === "seo-yenile") {
    el.disabled = true; el.textContent = t("Fetching…");
    try { await loadSeo(true); notify(t("SEO data refreshed.")); } catch { notify(t("Could not refresh.")); }
    return render();
  }
  if (action === "seo-gunluk") {
    const id = el.closest("[data-seo-is]").dataset.seoIs;
    return writeSeo({ op: "gunluk", id, deger: el.getAttribute("aria-checked") !== "true" });
  }
  if (action === "seo-firsat") {
    const f = seoData.firsatlar.find((x) => x.id === el.dataset.id), order = SEO_STATES.map(([d]) => d);
    return writeSeo({ op: "firsat", id: f.id, durum: order[(order.indexOf(f.durum) + 1) % order.length] });
  }
  if (action === "seo-ekle") {
    const title = $("#seo-yeni").value.trim();
    return title && writeSeo({ op: "firsat_ekle", baslik: title });
  }
  if (action === "seo-kontrol") return writeSeo({ op: "kontrol", no: +el.dataset.no, geri: !!el.dataset.geri });
  if (action === "seo-onizleme-yenile") return fetchPreview(el.dataset.url, true);
  const pageRow = e.target.closest("[data-seo-sayfa]");
  if (pageRow) {
    const url = pageRow.dataset.seoSayfa;
    openPage = openPage === url ? null : url;
    return openPage && !previews[url] ? fetchPreview(url) : render();
  }
  const post = e.target.closest("[data-seo-yazi]");
  if (post && !e.target.closest("a")) { openPost = openPost === post.dataset.seoYazi ? null : post.dataset.seoYazi; render(); }
});
// the periodic re-render must not wipe the field while typing
document.addEventListener("focusin", (e) => { if (e.target.id === "seo-yeni") editing = true; });
document.addEventListener("focusout", (e) => { if (e.target.id === "seo-yeni") editing = false; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "seo-yeni" && e.target.value.trim()) writeSeo({ op: "firsat_ekle", baslik: e.target.value.trim() });
});


render();
window.addEventListener("focus", () => { if (!isHidden() && !editing) loadSeo().then(render).catch(() => {}); });
</script>
</body>
</html>
