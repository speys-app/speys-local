/** Tables on the left, the statement on the right, one line from each. */
function flow(tables, center) {
  if (!tables.length) return "";

  const cy = h / 2;

    return `<path d="M${tw},${y} C${tw + 60},${y} ${cx - 60},${cy} ${cx},${cy}" fill="none" stroke="currentColor" stroke-opacity=".25"/>

  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="color:var(--m)">${nodes}
    <rect x="${cx}" y="${cy - 13}" width="${w - cx}" height="26" rx="7" fill="var(--m)"/><text x="${cx + 10}" y="${cy + 4}" font-size="12" font-weight="700" fill="var(--bg)" font-family="ui-monospace,Menlo,monospace">${esc(String(center).slice(0, 34))}</text></svg>`;

/** The practice database as boxes with foreign key lines. */
function er(tables) {
  const bw = 200, gap = 40, lh = 18, head = 26;
  // One row per group of related tables, the referenced table first: lines stay short and flat.
  const linked = (a, b) => a.refs.some((r) => r.table === b.name) || b.refs.some((r) => r.table === a.name);
  const rows = [];
  for (const t of tables) {
    const row = rows.find((r) => r.some((x) => linked(x, t)));
    if (row) row.push(t); else rows.push([t]);
  }
  for (const r of rows) r.sort((a, b) => (a.refs.some((x) => x.table === b.name) ? 1 : b.refs.some((x) => x.table === a.name) ? -1 : 0));
  const pos = {};
  let maxH = 0;
  rows.forEach((r, ri) => r.forEach((t, k) => {
    pos[t.name] = { x: k * (bw + gap), row: ri, h: head + t.columns.length * lh + 8 };
    maxH = Math.max(maxH, pos[t.name].h);
  }));
  const cols = Math.max(...rows.map((r) => r.length));
  for (const t of tables) pos[t.name].y = pos[t.name].row * (maxH + 36);
  const W = cols * bw + (cols - 1) * gap, H = Math.max(...tables.map((t) => pos[t.name].y + pos[t.name].h)) + 4;
  const colY = (t, c) => pos[t.name].y + head + t.columns.findIndex((x) => x.name === c) * lh + lh / 2 + 2;
  const lines = tables.flatMap((t) => t.refs.map((r) => {
    const to = tables.find((x) => x.name === r.table);
    if (!to) return "";
    const a = pos[t.name], b = pos[to.name];
    const ay = colY(t, r.from), by = colY(to, r.to);
    const ax = a.x < b.x ? a.x + bw : a.x, bx = a.x < b.x ? b.x : a.x === b.x ? b.x : b.x + bw;
    const bend = a.x === b.x ? -40 : 0;
    return `<path d="M${ax},${ay} C${(ax + bx) / 2 + bend},${ay} ${(ax + bx) / 2 + bend},${by} ${bx},${by}" fill="none" stroke="var(--ok)" stroke-width="1.5" stroke-opacity=".7"/>`;
  })).join("");
  const boxes = tables.map((t) => {
    const p = pos[t.name];
    return `<g transform="translate(${p.x},${p.y})"><rect width="${bw}" height="${p.h}" rx="9" fill="var(--y)" stroke="var(--c)"/>
      <rect width="${bw}" height="${head}" rx="9" fill="var(--y2)"/><text x="10" y="17" font-size="12.5" font-weight="700" fill="var(--m)">${esc(t.name)} <tspan fill="var(--s)" font-weight="400">· ${t.rows}</tspan></text>
      ${t.columns.map((c, k) => `<text x="10" y="${head + k * lh + 14}" font-size="12" fill="${c.pk ? "var(--m)" : "var(--s)"}" font-family="ui-monospace,Menlo,monospace">${c.pk ? "🔑 " : t.refs.some((r) => r.from === c.name) ? "↗ " : ""}${esc(c.name)}</text>`).join("")}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%">${lines}${boxes}</svg>`;
}

/** A query, one clause per line, keywords a little stronger. */
function sqlBlock(q) {
  const kw = /\b(WITH|SELECT|DISTINCT|FROM|WHERE|AND|OR|IN|IS|NOT|NULL|EXISTS|ORDER BY|GROUP BY|PARTITION BY|OVER|FILTER|HAVING|LIMIT|DESC|ASC|LEFT JOIN|JOIN|ON|AS|CASE|WHEN|THEN|ELSE|END|COUNT|MAX|MIN|AVG|SUM|COALESCE|ROW_NUMBER|RANK|UNION|INSERT INTO|VALUES|UPDATE|SET|RETURNING)\b/g;
  return `<pre>${q.split("\n").map((l) => `<div><span class="n"></span><span>${esc(l).replace(kw, "<b>$1</b>")}</span></div>`).join("")}</pre>`;
}

// —— visuals: a before → after picture per lesson, from the sandbox rows ——
const PAL = ["#22c55e", "#3b82f6", "#f59e0b", "#ec4899", "#8b5cf6", "#14b8a6", "#ef4444", "#84cc16", "#06b6d4", "#f97316"];

function painter() {

/** A small table; `row(r, i)` may return { cls, color }, `cell(r, j, i)` a class. Columns starting with _ stay hidden. */
function vt(t, { row = () => ({}), cell = () => "", on = new Set() } = {}) {
  const cols = t.columns.map((c, j) => [c, j]).filter(([c]) => !c.startsWith("_"));
  return `<table class="vt"><tr>${cols.map(([c]) => `<th class="${on.has(c) ? "on" : ""}">${esc(c)}</th>`).join("")}</tr>${t.rows.map((r, i) => {
    const o = row(r, i) || {};

      const v = r[j], tint = o.color ? `style="background:color-mix(in srgb,${o.color} 26%,var(--y2))"` : "";
      return `<td class="${[cell(r, j, i), on.has(c) ? "on" : "", v === null ? "null" : ""].join(" ")}" ${tint}>${v === null ? "NULL" : esc(v)}</td>`;
    }).join("")}</tr>`;
  }).join("")}</table>`;
}
const col = (t, name) => t.columns.indexOf(name);
const side = (title, body, cls = "") => `<div class="vzc ${cls}"><b>${title}</b>${body}</div>`;
const arrow = (label) => `<div class="arrow"><i>→</i>${label ? esc(label) : ""}</div>`;

function viz(v) {
  const S0 = v.source, R = v.result;
  if (v.kind === "select") {
    const on = new Set(v.pick), keep = S0.columns.map((c, j) => [c, j]).filter(([c]) => on.has(c));
    const res = { columns: keep.map(([c]) => c), rows: S0.rows.map((r) => keep.map(([, j]) => r[j])) };
    return `<div class="viz">${side(L.before, vt(S0, { on }))}${arrow("SELECT " + v.pick.join(", "))}${side(L.after, vt(res))}</div>`;
  }
  if (v.kind === "filter") {
    const k = col(S0, "_keep");
    const res = { columns: S0.columns, rows: S0.rows.filter((r) => r[k]) };
    return `<div class="viz">${side(L.before, vt(S0, { row: (r) => (r[k] ? { color: "#22c55e" } : { cls: "off" }) }))}${arrow(v.note)}${side(L.after, vt(res))}</div>`;
  }
  if (v.kind === "sort") {
    return `<div class="viz">${side(L.before, vt(S0))}${arrow(`ORDER BY … DESC${v.limit ? ` · LIMIT ${v.limit}` : ""}`)}${side(L.after, vt(R, { row: (r, i) => (v.limit && i >= v.limit ? { cls: "cut" } : i === v.limit - 1 ? { cls: "limit", color: "#22c55e" } : { color: "#22c55e" }) }))}</div>`;
  }
  if (v.kind === "group") {
    const paint = painter(), k = col(S0, v.key), keep = col(R, "_keep");
    return `<div class="viz">${side(L.before, vt(S0, { row: (r) => ({ color: paint(r[k]) }) }))}${arrow("GROUP BY " + v.key + (v.note ? " · " + v.note : ""))}${side(L.after, vt(R, { row: (r) => (keep >= 0 && !r[keep] ? { cls: "off", color: paint(r[0]) } : { color: paint(r[0]) }) }))}</div>`;
  }
  if (v.kind === "aggregate") {
    const k = col(S0, v.column);
    const big = `<div class="big">${R.columns.map((c, j) => `<div><b>${esc(R.rows[0][j])}</b><small>${esc(c)}</small></div>`).join("")}</div>`;

    const res = vt(R, { row: (r) => (r.some((x) => x === null) ? { cls: "bad" } : {}) });
    return `<div class="viz three">${side(v.leftName || "", left)}${side(v.rightName || "", right)}${side(L.after + (v.outer ? " · LEFT JOIN" : " · JOIN"), res, "res")}</div>`;

  }

}

function resultHtml(r) {

  if (r.error) return slips + (slips ? `<p class="more">${L.sqlError}: ${esc(r.error)}</p>` : `<div class="fb no">${L.sqlError}: ${esc(r.error)}</div>`);
  let fb = "";
  if (r.ok === true) fb = `<div class="fb ok">${L.okLesson}</div>`;
  else if (r.ok === false) {

  const rows = a.lines.map((x) => `<div class="an${x.step ? "" : " cont"}"><span class="k">${x.step ? esc(kw(x.step)) : ""}</span>
      <pre><div>${esc(x.sql)}</div></pre><p>${md(x.why)}</p></div>`).join("");
  return `<div class="task"><b>${L.goal}</b>${md(a.goal)}</div>
    <div class="anat">${rows}</div>
    <h3>${L.answerRows}</h3>${resultHtml(a.result)}
    <div class="runrow" style="margin-top:16px">${cur + 1 < PL().length ? `<button class="btn main" data-run="read">${l.done ? L.nextLesson : L.gotIt} →</button>` : ""}</div>`;
}

/** The hint gives the way, not the answer: first the task's steps as questions, then the lesson's own hint. */
function hintBox(l, level) {
  const steps = (LS.writing?.steps || []).filter((s) => l.steps.includes(s.id));
  return `<div class="hintbox"><button class="x" data-run="close-hint" title="${L.close}">×</button><b>${L.taskSteps}</b><ol>${steps.map((s) => `<li><code>${esc(s.kw)}</code>${esc(s.q)}<small>${esc(s.how)}</small></li>`).join("")}</ol>
    ${level > 1 && l.hint ? `<p><span>${L.lastHint}</span>${md(l.hint)}</p>` : ""}</div>`;
}

/** The task in plain words above; here what the answer should look like: its columns as they are in the tables, and its rows. */
function expectedBox(l) {
  const r = l.expected;
  if (!r || r.error || !l.wants?.length) return "";
  const calc = l.wants.some((w) => typeof w !== "string");
  const head = l.wants.map((w) => typeof w === "string" ? `<th>${esc(w)}</th>` : `<th class="calc">${w.name ? `${esc(w.name)} ` : ""}<span>${L.calc[w.calc] || L.calc.value}</span></th>`).join("");
  return `<div class="expect"><div><b>${L.expected}</b><span>${L.rowsN(r.total)}${l.ordered ? " · " + L.inOrder : ""}</span></div>
    ${rowsTable(head, r.rows, "exp:" + l.id)}${calc ? `<small>${L.calcNote}</small>` : ""}</div>`;
}

/** The practice tables: one tab per table with its rows, and the diagram of how they connect. */
function tablesBox(l) {
  const ts = LS.schemas[l.tablesAt];
  const used = (l.wants || []).filter((w) => typeof w === "string").map((w) => w.split(".")[0]);
  const tab = ts.some((t) => t.name === tblTab) || tblTab === "@map" ? tblTab : used[0] || ts[0]?.name;
  const tabs = ts.map((t) => `<button data-tbl="${esc(t.name)}" class="${t.name === tab ? "on" : ""}">${esc(t.name)} <small>${t.rows}</small></button>`).join("")
    + `<button data-tbl="@map" class="${tab === "@map" ? "on" : ""}">${L.links}</button>`;
  let body;
  if (tab === "@map") body = er(ts);
  else {
    const t = ts.find((x) => x.name === tab);
    const wanted = new Set((l.wants || []).filter((w) => typeof w === "string" && w.startsWith(t.name + ".")).map((w) => w.split(".")[1]));
    const head = t.columns.map((c) => {
      const ref = t.refs.find((f) => f.from === c.name);
      return `<th class="${wanted.has(c.name) ? "on" : ""}">${c.pk ? "🔑 " : ref ? "↗ " : ""}${esc(c.name)}${ref ? `<small>→ ${esc(ref.table)}</small>` : ""}</th>`;
    }).join("");
    body = rowsTable(head, t.data, "tbl:" + t.name);
  }
  return `<div class="schema"><b>${L.tables}</b><div class="ttabs">${tabs}</div><div class="in">${body}</div></div>`;
}
let tblTab = null;

/** A table that shows its first 3 rows; the rest open on request and stay open (per key). */
const opened = new Set();
function rowsTable(head, rows, key) {
  const all = opened.has(key), shown = all ? rows : rows.slice(0, 3);
  const body = shown.map((row) => `<tr>${row.map((v) => v === null ? '<td class="null">NULL</td>' : `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
  const more = rows.length > 3 ? `<button class="linkbtn rowsmore" data-rows="${esc(key)}">${all ? L.fewer : L.moreRows(rows.length - 3)}</button>` : "";
  return `<div class="scroll${all ? " tall" : ""}"><table class="res"><tr>${head}</tr>${body}</table></div>${more}`;
}

/** The lesson packages, one row each: what it is, whose data, how far you are. */
function packagesView() {
  const rows = LS.packages.map((p) => {
    const ls = LS.lessons.filter((l) => l.pkg === p.id), done = ls.filter((l) => l.done).length;
    if (!ls.length) return `<div class="pkg empty"><div class="top"><b>${esc(p.title)}</b></div><p>${esc(p.about)}</p><p class="more">${L.makeYours}</p></div>`;
    const own = ls.some((l) => l.source === "repo"), next = ls.find((l) => !l.done);
    return `<a class="pkg" href="#/lessons/${esc(p.id)}"><div class="top"><b>${esc(p.title)}</b><span class="chip ${own ? "src repo" : ""}">${own ? L.ownTables : L.sampleData}</span></div>
      <p>${esc(p.about)}</p><div class="prog"><span class="pbar"><i style="width:${(100 * done) / ls.length}%"></i></span>
      <small>${L.lessonsDone(done, ls.length)}${next ? ` · ${L.nextUp}: ${esc(next.title)}` : ""}</small></div></a>`;
  }).join("");
  return `<h2 class="ph">${L.lessons}</h2><div class="pkgs">${rows}</div>`;
}

/** A query from your own repo: what it is for, the code as it is, its parts with why. */
function yoursView(l) {
  const y = l.yours;
  const pre = `<pre>${y.code.split("\n").map((t, k) => `<div><span class="n">${y.line + k}</span><span>${esc(t) || " "}</span></div>`).join("")}</pre>`;
  return `<p>${md(y.purpose)}</p><h3>${L.inYourCode}</h3>${pre}<div class="where">${esc(y.file)}:${y.line}</div>
    <h3>${L.partByPart}</h3>${y.walk.map((w) => `<div class="ex"><p class="note">${md(w.why)}</p>${sqlBlock(w.code)}</div>`).join("")}
    ${y.practice ? `<h3>${L.practiceDiff}</h3><p>${md(y.practice)}</p>` : ""}`;
}

function lessonsView() {
  if (!LS) return "";
  const ls = PL(), l = ls[cur], p = LS.packages.find((x) => x.id === pkg);
  const nav = `<a class="back" href="#/lessons">← ${L.packages}</a><b class="pname">${esc(p.title)}</b>`
    + ls.map((x, k) => `<button data-lesson="${k}" class="${k === cur ? "on" : ""} ${x.done ? "ok" : ""}"><i>${x.done ? "✓" : k + 1}</i>${esc(x.title)}</button>`).join("");
  const draft = drafts[l.id] ?? "";
  const hintLevel = outs[l.id + ":hint"] || 0;
  if (l.read) {
    return `<div class="ls"><nav class="col" data-col="nav">${nav}</nav>
  <div class="col work" data-col="work:${esc(l.id)}">
    <span class="chip">${cur + 1} / ${ls.length}</span><h2>${esc(l.title)}</h2>${readView(l)}</div>
  <div class="col explain" data-col="explain:${esc(l.id)}"><p>${md(l.explain)}</p>${writingBox()}</div></div>`;
  }
  return `<div class="ls"><nav class="col" data-col="nav">${nav}</nav>
  <div class="col work" data-col="work:${esc(l.id)}">
    <span class="chip">${cur + 1} / ${ls.length}</span> <span class="chip src ${l.source}">${l.yours ? L.fromYours : l.source === "repo" ? L.fromRepo : L.fromDefault}</span><h2>${esc(l.title)}</h2>
    <div class="task"><b>${L.task}</b>${md(l.task)}${expectedBox(l)}
      <textarea class="ed" id="ed" spellcheck="false" placeholder="SELECT …&#10;FROM …&#10;WHERE …">${esc(draft)}</textarea>
      <div class="runrow"><button class="btn main" data-run="check">${L.check} <small style="opacity:.6">⌘↵</small></button>
        ${hintLevel < 2 ? `<button class="btn" data-run="hint">${hintLevel ? L.moreHint : L.hint}</button>` : ""}<button class="btn" data-run="solution">${L.solution}</button>
        ${l.done && cur + 1 < ls.length ? `<button class="btn" data-run="next">${L.nextLesson} →</button>` : ""}</div>
      ${outs[l.id + ":sol"] ? `<div class="sol"><div>${L.solutionTitle}<span><button data-run="copy">${L.copy}</button> <button data-run="close-sol" title="${L.close}">×</button></span></div>${sqlBlock(l.solution)}</div>` : ""}
      ${hintLevel ? hintBox(l, hintLevel) : ""}<div class="out" id="out">${outs[l.id] ? `<button class="x" data-run="close" title="${L.close}">×</button>` : ""}${resultHtml(outs[l.id])}</div></div>
    ${tablesBox(l)}
    <div class="nb"><h3>${L.lessonNotes}</h3>${LS.notes.auto.filter((n) => n.lesson === l.id).map((n) => slipCard(n, false)).join("")}${ownNote(l.id)}</div>
  </div>
  <div class="col explain" data-col="explain:${esc(l.id)}">
    ${l.yours ? yoursView(l) : `<p>${md(l.explain)}</p>
    ${l.hasVisual ? `<div class="vzbox"><h3>${L.whatHappens}</h3><div id="viz">${vizCache[l.id] ? viz(vizCache[l.id]) : ""}</div></div>` : ""}
    ${l.examples.map((e) => `<div class="ex">${e.note ? `<p class="note">${md(e.note)}</p>` : ""}<div class="exrow">${sqlBlock(e.sql)}<div class="out">${resultHtml(e.result)}</div></div></div>`).join("")}
    ${l.mine ? `<div class="mine"><h3>${L.inMine} · ${L.inMineCount(l.mineCount)}</h3>${code(l.mine)}</div>` : ""}`}
  </div></div>`;
}

function todayView() {
  const qs = S.questions;
  if (!qs.length) return `<div class="card done"><h2>${S.answeredToday ? L.doneTitle : "—"}</h2><p class="empty">${L.nothing}</p></div>`;
  if (i >= qs.length) {
    const r = results.filter(Boolean).length;
    return `<div class="card done"><h2>${L.doneTitle}</h2><p>${L.doneText(r, qs.length)}</p></div>`;
  }
  const q = qs[i];
  const dots = qs.map((_, k) => `<i class="${k < i ? (results[k] ? "ok" : "no") : k === i ? "now" : ""}"></i>`).join("");
  const opts = q.options.map((o, k) => {
    let cls = "";
    if (picked) { if (q.order[k] === picked.answer) cls = "right"; else if (k === picked.k) cls = "wrong"; }
    return `<button data-k="${k}" class="${cls}" ${picked ? "disabled" : ""}>${esc(o)}</button>`;
  }).join("");
  const res = picked ? `<div class="result"><b class="${picked.correct ? "ok" : "no"}">${picked.correct ? L.right : L.wrong}</b>
      <p>${esc(picked.explain)}</p><small>${L.again(fmtDay(picked.due))}</small></div>
      <button class="next">${i + 1 < qs.length ? L.next : L.finish}</button>` : "";
  return `<div class="dots">${dots}</div><div class="card"><span class="chip">${esc(q.name)}</span>
    <h2>${esc(q.q)}</h2>${code(q.example)}<div class="opts">${opts}</div>${res}</div>`;
}

function mapView() {
  const used = S.topics.filter((t) => t.count), unused = S.topics.filter((t) => !t.count);
  const max = Math.max(...used.map((t) => t.count), 1);
  const row = (t) => `<details class="topic"><summary><b>${esc(t.name)}</b>
      <span class="bar"><i style="width:${Math.max(3, (100 * Math.log(1 + t.count)) / Math.log(1 + max))}%"></i></span>
      <span class="count">${t.count} ${L.times}</span>
      <span class="box">${[1, 2, 3, 4, 5].map((b) => `<i class="${t.box != null && t.box >= b ? "on" : ""}"></i>`).join("")}</span></summary>
      <div class="body"><p>${esc(t.explain)}</p><p class="empty">${L.inFiles(t.files)}</p>${t.example ? code(t.example) : ""}</div></details>`;
  const groups = [1, 2, 3].map((lv) => {
    const ts = used.filter((t) => t.level === lv).sort((a, b) => b.count - a.count);
    return ts.length ? `<h3>${L.level[lv]}</h3>${ts.map(row).join("")}` : "";
  }).join("");
  return `<div class="stats"><div><b>${S.files}</b>${L.files}</div><div><b>${S.statements}</b>${L.statements}</div>
      <div><b>${used.length}/${S.topics.length}</b>${L.used}</div></div>${groups}
    ${unused.length ? `<h3>${L.unused}</h3>${unused.map((t) => `<div class="gap"><b>${esc(t.name)}</b><p>${esc(t.why || t.explain)}</p></div>`).join("")}` : ""}`;
}

function draw() {
  document.querySelectorAll(".tab").forEach((b) => { b.textContent = L[b.dataset.v]; b.classList.toggle("on", b.dataset.v === view); });
  $("#meta").textContent = S.root.split(/[\\/]/).slice(-2).join("/");
  if (view === "lessons" && pkg) setTimeout(() => loadViz(lesson().id));
  document.body.classList.toggle("wide", view === "lessons" && !!pkg);
  // columns scroll on their own: keep their place across redraws (a new lesson has new keys, so it starts at the top)
  document.querySelectorAll("[data-col]").forEach((c) => (colScroll[c.dataset.col] = c.scrollTop));
  $("#main").innerHTML = view === "lessons" ? (pkg ? lessonsView() : packagesView()) : view === "notes" ? notesView() : view === "today" ? todayView() : mapView();
  document.querySelectorAll("[data-col]").forEach((c) => (c.scrollTop = colScroll[c.dataset.col] || 0));
}
const colScroll = {};

document.addEventListener("click", async (e) => {
  const tab = e.target.closest(".tab");
  if (tab) return go(HASH[tab.dataset.v]);
  const opt = e.target.closest(".opts button");
  if (opt && !picked) {
    const q = S.questions[i], k = +opt.dataset.k;
    const r = await fetch(api("/api/answer"), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: q.topic, variant: q.variant, choice: q.order[k] }) }).then((x) => x.json());
    picked = { ...r, k };
    results[i] = r.correct;
    return draw();
  }
  if (e.target.closest(".next")) { i++; picked = null; draw(); scrollTo(0, 0); }
  const rw = e.target.closest("[data-rows]");
  if (rw) { opened.has(rw.dataset.rows) ? opened.delete(rw.dataset.rows) : opened.add(rw.dataset.rows); return redraw(); }
  const tb = e.target.closest("[data-tbl]");
  if (tb) { tblTab = tb.dataset.tbl; return redraw(); }
  const nb = e.target.closest("[data-lesson]");
  if (nb) return go(`lessons/${pkg}/${PL()[+nb.dataset.lesson].id}`);
  const nt = e.target.closest("[data-note]");
  if (nt) {
    if (nt.dataset.note === "edit") { noteEdit = nt.dataset.l; draw(); return $("#own-ed")?.focus(); }
    if (nt.dataset.note === "cancel") { noteEdit = null; return draw(); }
    if (nt.dataset.note === "save") {
      LS.notes = await fetch(api("/api/note"), { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lesson: nt.dataset.l, text: $("#own-ed").value }) }).then((x) => x.json());
      noteEdit = null;
      return draw();
    }
  }
  const rb = e.target.closest("[data-run]");
  if (rb) return runLesson(rb.dataset.run, +rb.dataset.n || 0);
});
// Undo / redo of our own: the page is redrawn after every run, which wipes the browser's history.
// Typing within half a second (and not after a space) folds into one step, like an editor would.
const hist = {};
function snap(id, el, fold) {
  const h = (hist[id] ||= { stack: [{ v: "", a: 0 }], i: 0, t: 0 });
  const v = el.value, now = Date.now();
  if (h.stack[h.i].v === v) return;
  if (fold && h.i > 0 && now - h.t < 500 && !/\s$/.test(h.stack[h.i].v)) h.stack[h.i] = { v, a: el.selectionStart };
  else { h.stack = h.stack.slice(0, h.i + 1); h.stack.push({ v, a: el.selectionStart }); h.i = h.stack.length - 1; }
  if (h.stack.length > 300) { h.stack.shift(); h.i--; }
  h.t = now;
}
function step(id, el, dir) {
  const h = hist[id];
  if (!h || h.i + dir < 0 || h.i + dir >= h.stack.length) return;
  h.i += dir;
  const { v, a } = h.stack[h.i];
  el.value = v; drafts[id] = v;
  el.setSelectionRange(Math.min(a, v.length), Math.min(a, v.length));
  h.t = 0;
}
document.addEventListener("input", (e) => {
  if (e.target.id !== "ed") return;
  const id = lesson().id;
  drafts[id] = e.target.value;
  snap(id, e.target, e.inputType?.startsWith("insertText") || e.inputType?.startsWith("deleteContent"));
});
document.addEventListener("keydown", (e) => {
  if (e.target.id !== "ed") return;
  const id = lesson().id, mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && e.key === "Enter") { e.preventDefault(); runLesson("check"); }
  else if (mod && k === "z") { e.preventDefault(); step(id, e.target, e.shiftKey ? 1 : -1); }
  else if (mod && k === "y") { e.preventDefault(); step(id, e.target, 1); }
  else if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, p = t.selectionStart;
    t.value = t.value.slice(0, p) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = p + 2;
    drafts[id] = t.value; snap(id, t, false);
  }
});
async function runLesson(what, n = 0) {
  const l = lesson();
  if (what === "next") return go(`lessons/${pkg}/${PL()[cur + 1].id}`);
  if (what === "read") {
    if (!l.done) l.done = (await fetch(api("/api/done"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lesson: l.id }) }).then((x) => x.json())).done;
    return go(`lessons/${pkg}/${PL()[cur + 1].id}`);
  }
  // anything that opened under the editor can be closed again
  if (what === "close") { delete outs[l.id]; return redraw(); }
  if (what === "close-sol") { delete outs[l.id + ":sol"]; return redraw(); }
  if (what === "close-hint") { delete outs[l.id + ":hint"]; return redraw(); }
  if (what === "hint") { outs[l.id + ":hint"] = Math.min(2, (outs[l.id + ":hint"] || 0) + 1); return redraw(); }
  // the solution is shown next to your query, never written over it
  if (what === "solution") { outs[l.id + ":sol"] = true; return redraw(); }
  if (what === "copy") {
    navigator.clipboard?.writeText(l.solution);
    const b = document.querySelector('[data-run="copy"]'); if (b) b.textContent = L.copied;
    return;
  }
  const sql = what === "example" ? l.examples[n].sql : (drafts[l.id] ?? $("#ed").value);
  const r = await fetch(api("/api/run"), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, lesson: what === "example" ? null : l.id }) }).then((x) => x.json());
  outs[what === "example" ? l.id + ":ex" + n : l.id] = r;
  if (what === "check" && r.ok) l.done = l.done || new Date().toISOString().slice(0, 10);
  if (r.mistakes?.length) LS.notes = (await fetch(api("/api/lessons")).then((x) => x.json())).notes;
  redraw();
}

/** draw() rebuilds the page; keep the editor's focus and cursor where they were. */
function redraw() {
  const ed = $("#ed"), had = ed && document.activeElement === ed, a = ed?.selectionStart, b = ed?.selectionEnd;
  draw();
  const n = $("#ed");
  if (n && (had || a != null)) { n.focus(); n.setSelectionRange(a ?? n.value.length, b ?? n.value.length); }
}

async function load() {
  MODS = await fetch("./api/modules").then((r) => r.json());
  if (!MODS.some((m) => m.id === M)) M = MODS[0].id;
  const [s, ls] = await Promise.all([fetch(api("/api/state")).then((r) => r.json()), fetch(api("/api/lessons")).then((r) => r.json())]);
  S = s; LS = ls; L = T[s.lang] || T.en;
  document.documentElement.lang = s.lang;
  i = 0; picked = null; results = []; outs = {}; drafts = {};
  for (const k in vizCache) delete vizCache[k];
  route();
}
load();
</script>
</body>
</html>
