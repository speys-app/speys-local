<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM</title>
<link rel="stylesheet" href="/kit.css">
</head>
<body>

<main id="icerik"></main>
<script src="/kit.js"></script>
<script>
"use strict";

let editing = false, dragging = null;
function render() {
  const scroll = scrollY;
  $("#icerik").innerHTML = crm?.not_configured ? notConfigured("CRM") : renderBoard();
  scrollTo(0, scroll);
}
async function refresh() {
  if (isHidden() || editing || dragging) return; // the screen must not change under someone typing or dragging
  try { await loadCrm(); render(); } catch { notify(t("Could not reach the server.")); }
}
document.documentElement.style.setProperty("--ust", "0px");
// —— CRM ————————————————————————
// Layout: business → pipeline tabs → board with a column per stage; dragging a card changes its stage,
// clicking one opens the record panel on the right (preview first, fields after "Edit").
let crm = null;
const view = { business: localStorage.getItem("panel.crmIsletme") || "", pipeline: localStorage.getItem("panel.crmHat") || "",
  selected: null, edit: false, meeting: false, add: false };
const MEETING_KINDS = { visit: t("Visit"), call: t("Call"), meeting: t("Meeting"), email: t("Email"), note: t("Note") };
async function loadCrm() { crm = await getJson("./api/crm"); }
async function writeCrm(body) {
  const r = await fetch("./api/crm", { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" }, body: JSON.stringify({ ...body, surum: crm.surum }) });
  if (r.status === 409) notify(t("The CRM changed in the meantime, refreshed."));
  else if (!r.ok) notify(t("Could not save: {error}", { error: (await r.json().catch(() => ({}))).error || r.status }));
  await loadCrm(); render();
  return r.ok;
}
const dealName = (deal) => deal.title || deal.place_name || "?";
const daysUntil = (iso) => Math.round((new Date(iso + "T00:00") - new Date(isoDay(new Date()) + "T00:00")) / 864e5);
const dueClass = (iso) => { const days = daysUntil(iso); return days < 0 ? "gecikti" : days === 0 ? "bugun" : ""; };
const shortDate = (iso) => (iso ? formatDate(iso) : "");

function currentSelection() {
  const businesses = crm.isletmeler;
  if (!businesses.some((b) => b.id === view.business)) view.business = (businesses.find((b) => b.name === crm.varsayilan_isletme) || businesses[0])?.id || "";
  const pipelines = crm.hatlar.filter((p) => p.business_id === view.business);
  if (!pipelines.some((p) => p.id === view.pipeline)) view.pipeline = pipelines[0]?.id || "";
  return { businesses, pipelines, pipeline: pipelines.find((p) => p.id === view.pipeline) };
}

function dealCard(deal) {
  const contact = deal.contact_name || deal.contact_role;
  // On a closed record (won / lost) a past date is not a warning.
  const closed = crm.asamalar.find((s) => s.pipeline_id === deal.pipeline_id && s.key === deal.stage)?.kind !== "open";
  return `<button type="button" class="crm-kart${view.selected === deal.id ? " secili" : ""}" draggable="true" data-is="crm-sec" data-id="${esc(deal.id)}">
    <b>${esc(dealName(deal))}</b>
    <span class="crm-meta">${[
      deal.place_district ? `📍 ${esc(deal.place_district)}` : "",
      contact ? `👤 ${esc(contact)}` : "",
      deal.son_gorusme ? `<span title="${esc(t("Last meeting"))}">↺ ${shortDate(deal.son_gorusme)}</span>` : "",
      deal.assignee ? `@${esc(deal.assignee)}` : "",
    ].filter(Boolean).join(" · ")}</span>
    ${deal.next_action_at || deal.next_action ? `<span class="crm-vade ${deal.next_action_at && !closed ? dueClass(deal.next_action_at) : ""}">${deal.next_action_at ? `📅 ${shortDate(deal.next_action_at)}` : ""}${deal.next_action_at && deal.next_action ? " · " : ""}${esc(deal.next_action || "")}</span>` : ""}
  </button>`;
}

function renderBoard() {
  if (!crm) { loadCrm().then(render); return `<p class="bos">${esc(t("Loading…"))}</p>`; }
  const { businesses, pipelines, pipeline } = currentSelection();
  if (!pipeline) return `<p class="bos">${esc(t("No pipeline."))}</p>`;
  const stages = crm.asamalar.filter((s) => s.pipeline_id === pipeline.id).sort((a, b) => a.position - b.position);
  const deals = crm.kayitlar.filter((d) => d.pipeline_id === pipeline.id);
  const countOf = (p) => crm.kayitlar.filter((d) => d.pipeline_id === p.id).length;
  const open = deals.filter((d) => stages.find((s) => s.key === d.stage)?.kind === "open");
  const due = open.filter((d) => d.next_action_at && daysUntil(d.next_action_at) <= 0).length;
  const columns = stages.map((stage, i) => {
    const rows = deals.filter((d) => d.stage === stage.key)
      .sort((x, y) => (x.next_action_at || "9999").localeCompare(y.next_action_at || "9999"));
    return `<section class="crm-sutun" data-asama="${esc(stage.key)}">
      <header><i style="background:${esc(stage.color)}"></i><span>${esc(stage.label)}</span><small>${rows.length}</small>
        ${i === 0 ? `<button type="button" class="crm-arti" data-is="crm-ekle" title="${esc(t("Add record"))}">+</button>` : ""}</header>
      ${i === 0 && view.add ? `<form class="crm-ekle" data-is-form="crm-ekle"><input id="crm-yeni" placeholder="${esc(t("Customer or record name"))}" autocomplete="off"><button>${esc(t("Add"))}</button></form>` : ""}
      <div class="crm-kartlar">${rows.map(dealCard).join("") || `<p class="bos">${esc(t("Empty"))}</p>`}</div>
    </section>`;
  }).join("");
  const selected = crm.kayitlar.find((d) => d.id === view.selected);
  return `<div class="crm-ust">
      <div class="cipler">${businesses.map((b) => `<button type="button" class="${b.id === view.business ? "secili" : ""}" data-is="crm-isletme" data-id="${esc(b.id)}">${esc(b.name)}</button>`).join("")}</div>
      <div class="crm-hatlar">${pipelines.map((p) => `<button type="button" class="${p.id === pipeline.id ? "secili" : ""}" data-is="crm-hat" data-id="${esc(p.id)}">${esc(p.name)} <small>${countOf(p)}</small></button>`).join("")}</div>
      <span class="soluk crm-ozet">${esc(t("{n} open", { n: open.length }))}${due ? ` · <b class="gecikti">${esc(due === 1 ? t("{n} follow-up due", { n: due }) : t("{n} follow-ups due", { n: due }))}</b>` : ""}${crm.aktarildi ? ` · ${esc(t("Imported from Speys {time}", { time: timeAgo(new Date(crm.aktarildi).getTime() / 1000) }))}` : ""}</span>
    </div>
    <div class="crm-pano">${columns}</div>
    ${selected ? dealPanel(selected) : ""}`;
}

function dealPanel(deal) {
  const pipeline = crm.hatlar.find((p) => p.id === deal.pipeline_id);
  const business = crm.isletmeler.find((b) => b.id === deal.business_id);
  const stages = crm.asamalar.filter((s) => s.pipeline_id === deal.pipeline_id).sort((a, b) => a.position - b.position);
  const products = crm.ayarlar.find((s) => s.business_id === deal.business_id)?.products || [];
  const meetings = crm.gorusmeler.filter((m) => m.deal_id === deal.id);
  const row = (icon, label, value) => `<div class="crm-ozellik"><span>${icon} ${esc(label)}</span><div>${value}</div></div>`;
  const field = (name, placeholder, type = "text") => `<input data-alan="${name}" type="${type}" value="${esc(deal[name] || "")}" placeholder="${esc(placeholder)}">`;
  const body = view.edit ? `
      ${row("👤", t("Contact"), `<div class="crm-iki">${field("contact_name", t("Name"))}${field("contact_role", t("Role"))}</div>`)}
      ${row("📞", t("Phone"), field("contact_phone", t("Phone number"), "tel"))}
      ${row("📅", t("Next action"), `<div class="crm-iki">${field("next_action", t("What to do"))}${field("next_action_at", "", "date")}</div>`)}
      ${products.length ? row("📦", t("Products"), products.map((u) => `<label class="crm-urun"><input type="checkbox" data-urun value="${esc(u)}" ${(deal.products || []).includes(u) ? "checked" : ""}> ${esc(u)}</label>`).join("")) : ""}
      ${deal.stage === "lost" ? row("✕", t("Lost reason"), field("lost_reason", t("Reason"))) : ""}
      <div class="crm-not"><span>📝 ${esc(t("Note"))}</span><textarea data-alan="notes" rows="5">${esc(deal.notes || "")}</textarea></div>
      <div class="crm-dugmeler"><button type="button" class="ana" data-is="crm-kaydet">${esc(t("Save"))}</button><button type="button" data-is="crm-vazgec">${esc(t("Cancel"))}</button><button type="button" class="tehlike" data-is="crm-sil">${esc(t("Delete"))}</button></div>`
    : `
      ${deal.contact_name || deal.contact_role ? row("👤", t("Contact"), `${esc(deal.contact_name || "")}${deal.contact_role ? ` <small>${esc(deal.contact_role)}</small>` : ""}`) : ""}
      ${deal.contact_phone ? row("📞", t("Phone"), `<a href="tel:${esc(deal.contact_phone)}">${esc(deal.contact_phone)}</a>`) : ""}
      ${deal.next_action || deal.next_action_at ? row("📅", t("Next action"), `<span class="crm-vade ${deal.next_action_at ? dueClass(deal.next_action_at) : ""}">${deal.next_action_at ? formatDate(deal.next_action_at, true) : ""}</span> ${esc(deal.next_action || "")}`) : ""}
      ${(deal.products || []).length ? row("📦", t("Products"), deal.products.map((u) => `<span class="pil">${esc(u)}</span>`).join(" ")) : ""}
      ${deal.place_name ? row("📍", t("Place"), `${esc(deal.place_name)}${deal.place_district ? ` <small>${esc(deal.place_district)}</small>` : ""}`) : ""}
      ${deal.lost_reason ? row("✕", t("Lost reason"), esc(deal.lost_reason)) : ""}
      ${deal.notes ? `<div class="crm-not"><span>📝 ${esc(t("Note"))}</span><p>${esc(deal.notes).replace(/\n/g, "<br>")}</p></div>` : ""}
      <div class="crm-dugmeler"><button type="button" data-is="crm-duzenle">${esc(t("Edit"))}</button></div>`;
  return `<div class="crm-perde" data-is="crm-kapat"></div>
    <aside class="crm-panel">
      <header><button type="button" data-is="crm-kapat" title="${esc(t("Close"))}">✕</button><span class="soluk">${esc(business?.name || "")} / ${esc(pipeline?.name || "")}</span></header>
      <div class="crm-govde">
        ${view.edit && !deal.place_name ? `<input class="crm-baslik" data-alan="title" value="${esc(deal.title || "")}">` : `<h3 class="crm-baslik">${esc(dealName(deal))}</h3>`}
        ${row("▦", t("Stage"), stages.map((s) => `<button type="button" class="crm-asama${s.key === deal.stage ? " on" : ""}" style="--r:${esc(s.color)}" data-is="crm-asama" data-asama="${esc(s.key)}">${esc(s.label)}</button>`).join(""))}
        ${body}
        <section class="crm-gorusmeler">
          <h4>${esc(t("Meetings"))} <small>${meetings.length}</small><button type="button" data-is="crm-gorusme-ac">${esc(t("+ Add"))}</button></h4>
          ${view.meeting ? `<form class="crm-gorusme-form" data-is-form="crm-gorusme">
              <select id="crm-g-tur">${Object.entries(MEETING_KINDS).map(([kind, label]) => `<option value="${kind}">${esc(label)}</option>`).join("")}</select>
              <input id="crm-g-gun" type="date" value="${isoDay(new Date())}">
              <textarea id="crm-g-not" rows="2" placeholder="${esc(t("What was discussed"))}"></textarea>
              <div class="crm-dugmeler"><button class="ana">${esc(t("Save"))}</button><button type="button" data-is="crm-gorusme-kapat">${esc(t("Cancel"))}</button></div>
            </form>` : ""}
          <ul>${meetings.map((m) => `<li><b>${esc(MEETING_KINDS[m.kind] || m.kind)}</b> <small>${formatDate(m.occurred_on, true)}${m.user ? ` · @${esc(m.user)}` : ""}</small>
            <button type="button" class="crm-gsil" data-is="crm-gorusme-sil" data-id="${esc(m.id)}" title="${esc(t("Delete"))}">×</button>
            ${m.outcome ? `<p>${esc(m.outcome)}</p>` : ""}${m.note ? `<p>${esc(m.note).replace(/\n/g, "<br>")}</p>` : ""}</li>`).join("") || `<li class="bos">${esc(t("No meetings yet."))}</li>`}</ul>
        </section>
      </div>
    </aside>`;
}

document.addEventListener("click", async (e) => {
  const target = e.target.closest("[data-is^='crm-']");
  if (!target) return;
  const deal = crm?.kayitlar.find((d) => d.id === view.selected);
  switch (target.dataset.is) {
    case "crm-isletme": view.business = target.dataset.id; view.pipeline = ""; localStorage.setItem("panel.crmIsletme", view.business); view.selected = null; return render();
    case "crm-hat": view.pipeline = target.dataset.id; localStorage.setItem("panel.crmHat", view.pipeline); view.selected = null; return render();
    case "crm-sec": view.selected = target.dataset.id; view.edit = false; view.meeting = false; editing = false; return render();
    case "crm-kapat": view.selected = null; view.edit = false; view.meeting = false; editing = false; return render();
    case "crm-ekle": view.add = !view.add; editing = view.add; render(); return $("#crm-yeni")?.focus();
    case "crm-asama": return writeCrm({ op: "asama", id: deal.id, stage: target.dataset.asama });
    case "crm-duzenle": view.edit = true; editing = true; return render();
    case "crm-vazgec": view.edit = false; editing = false; return render();
    case "crm-kaydet": {
      const alanlar = {};
      document.querySelectorAll(".crm-panel [data-alan]").forEach((i) => { alanlar[i.dataset.alan] = i.value; });
      if (document.querySelector(".crm-panel [data-urun]")) alanlar.products = [...document.querySelectorAll(".crm-panel [data-urun]:checked")].map((i) => i.value);
      view.edit = false; editing = false;
      return writeCrm({ op: "guncelle", id: deal.id, alanlar });
    }
    case "crm-sil":
      if (!confirm(t('Delete "{name}" and its meetings?', { name: dealName(deal) }))) return;
      view.selected = null; view.edit = false; editing = false;
      return writeCrm({ op: "sil", id: deal.id });
    case "crm-gorusme-ac": view.meeting = true; editing = true; render(); return $("#crm-g-not")?.focus();
    case "crm-gorusme-kapat": view.meeting = false; editing = false; return render();
    case "crm-gorusme-sil": if (confirm(t("Delete this meeting?"))) return writeCrm({ op: "gorusme_sil", id: target.dataset.id }); return;
  }
});
document.addEventListener("submit", async (e) => {
  const form = e.target.closest("[data-is-form^='crm-']");
  if (!form) return;
  e.preventDefault();
  if (form.dataset.isForm === "crm-ekle") {
    const title = $("#crm-yeni").value.trim();
    if (!title) return;
    view.add = false; editing = false;
    await writeCrm({ op: "ekle", pipeline_id: view.pipeline, title });
    view.selected = crm.kayitlar.find((d) => d.title === title && d.pipeline_id === view.pipeline)?.id || null;
    return render();
  }
  if (form.dataset.isForm === "crm-gorusme") {
    view.meeting = false; editing = false;
    return writeCrm({ op: "gorusme", deal_id: view.selected, kind: $("#crm-g-tur").value, occurred_on: $("#crm-g-gun").value, note: $("#crm-g-not").value });
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.target.closest?.("input, textarea, select")) return;
  if (view.selected) { view.selected = null; view.edit = false; view.meeting = false; editing = false; render(); }
});
// Drag and drop: dropping a card on another column changes its stage.
let draggedId = null;
document.addEventListener("dragstart", (e) => {
  const card = e.target.closest?.(".crm-kart");
  if (!card) return;
  draggedId = card.dataset.id; dragging = true;
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", draggedId);
});
document.addEventListener("dragover", (e) => {
  const column = e.target.closest?.(".crm-sutun");
  if (!column || !draggedId) return;
  e.preventDefault();
  document.querySelectorAll(".crm-sutun.uzerinde").forEach((x) => x !== column && x.classList.remove("uzerinde"));
  column.classList.add("uzerinde");
});
document.addEventListener("drop", (e) => {
  const column = e.target.closest?.(".crm-sutun");
  if (!column || !draggedId) return;
  e.preventDefault();
  const deal = crm.kayitlar.find((d) => d.id === draggedId);
  draggedId = null; dragging = false;
  if (deal && deal.stage !== column.dataset.asama) writeCrm({ op: "asama", id: deal.id, stage: column.dataset.asama }); else render();
});
document.addEventListener("dragend", () => {
  if (!draggedId) return;
  draggedId = null; dragging = false;
  document.querySelectorAll(".crm-sutun.uzerinde").forEach((x) => x.classList.remove("uzerinde"));
});



render();
setInterval(refresh, 10000);
window.addEventListener("focus", () => {
  // a record was opened from Proposals on Today
  const picked = localStorage.getItem("panel.crmSecili");
  if (picked) {
    localStorage.removeItem("panel.crmSecili");
    Object.assign(view, { business: localStorage.getItem("panel.crmIsletme") || view.business, pipeline: localStorage.getItem("panel.crmHat") || view.pipeline, selected: picked, edit: false, meeting: false, add: false });
  }
  refresh();
});
</script>
</body>
</html>
